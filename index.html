          el('span', { class: 'ao-key', text: r < 4 ? r + 1 : '' }),
          gameImg([ability.image_webp, ability.image], { alt: '' }),
          el('span', { class: 'ao-name', text: ability.name }))),
      steps.map((s, i) => el('td', {}, s.ability_id === ability.id && aoMark(s.kind, s.tier, {
        tabindex: 0,
        'data-tip': `ability:${ability.id}:${s.kind === 'unlock' ? 0 : s.tier}`,
        'data-note': s.annotation?.trim() || null,
        'aria-label': `Step ${i + 1}: ${s.kind === 'unlock' ? 'unlock' : `tier ${s.tier} upgrade`} ${ability.name}`,
      })))))));

  return el('section', { class: 'category ao-panel' },
    el('header', { class: 'cat-head' },
      el('h3', { class: 'cat-name', text: 'Ability Order' }),
      el('p', { class: 'cat-desc', text: 'When to unlock each ability and spend ability points on its upgrades.' })),
    el('div', { class: 'ao-wrap' }, table),
    el('div', { class: 'legend' },
      el('span', {}, aoMark('unlock'), 'Unlock ability'),
      el('span', {}, aoMark('upgrade', 1), 'Tier 1 (1 AP)'),
      el('span', {}, aoMark('upgrade', 2), 'Tier 2 (2 AP)'),
      el('span', {}, aoMark('upgrade', 3), 'Tier 3 (5 AP)')));
}

/* ---------- duel matchups ---------- */

// Estimated 1v1 duels: your build against each hero's most-bought items at the same souls.
// Guns, item effects and abilities are all read from the game data; assumptions are listed in the UI.
const UNITS_PER_METER = 39.37;
const MAX_ITEMS = 12;
const META_MIN_PICK = 0.3; // an item counts as "meta" if at least this share of the hero's players buy it
const RELOAD_DELAY_FALLBACK = 0.25;
const BUILDUP_SECONDS = 3; // assumed seconds of steady hits before build-up items (Toxic Bullets…) trigger
const DOT_FALLBACK_SECONDS = 3; // for damage over time whose duration isn't in the data
const MIN_CAST_COOLDOWN = 3; // very short or passive cooldowns are floored so they aren't cast every tick
const SIM_STEP = 0.05;
const SIM_MAX = 60;
const SAMPLE_SECONDS = 10;
const DAMAGE_MODES = { full: 'Gun + items + abilities', items: 'Gun + item effects', gun: 'Gun only (always-on stats)' };

// Each build opens at its hero's ideal: max level with the full build, at the farthest range their
// gun still does full damage, against Phantom+ meta builds.
const IDEAL = { headshot: 15, abilityhit: 75, mode: 'full', ultimates: true, optional: true, rank: 'high' };
const MU = {
  souls: null, range: null, accuracy: null, ...IDEAL,
  excluded: new Set(), excludedAbilities: new Set(), expanded: new Set(), data: null, buildKey: null,
};

const maxSouls = hero => Math.max(0, ...Object.values(hero?.level_info ?? {}).map(l => l.required_gold ?? 0)) || 48000;

function idealRange(hero) {
  const weapon = state.assets?.byClass.get(hero?.items?.weapon_primary)?.weapon_info;
  const meters = weapon ? weapon.damage_falloff_start_range / UNITS_PER_METER : 15;
  return Math.round(Math.min(30, Math.max(5, meters)));
}

function applyIdealSettings() {
  Object.assign(MU, IDEAL, { souls: maxSouls(state.hero), range: idealRange(state.hero) });
  MU.accuracy = MU.data ? Math.round(MU.data.meta.accuracy * 100) : null;
}

const clamp01 = x => Math.min(1, Math.max(0, x));
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const statValue = v => Number(v && typeof v === 'object' ? v.value : v);
const isShopItem = id => { const it = state.assets.byId.get(id); return it?.type === 'upgrade' && !!it.shopable; };
const spiritScaled = p => ({ base: num(p?.value), scale: p?.scale_function?.specific_stat_scale_type === 'ETechPower' ? num(p.scale_function.stat_scale) : 0 });
const atSpirit = (sv, spirit) => (sv ? sv.base + sv.scale * spirit : 0);
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString();
const pct = n => `${Math.round(n * 100)}%`;
const signed = (n, unit = '') => `${n > 0 ? '+' : n < 0 ? '−' : ''}${fmt1(Math.abs(n))}${unit}`;
const fmtSv = sv => `${fmt1(sv.base)}${sv.scale ? ` + ${fmt1(sv.scale)}× spirit` : ''}`;
const fmtTime = t => (t == null ? `${SIM_MAX}s+` : `${fmt1(t)}s`);

/* data */

const loadHeroList = () => once('heroes', () => getJSON(`${API}/assets/heroes?only_active=true`));

// Query string for match analytics: matches since the latest patch, optionally Phantom+ only.
async function matchFilter(rank) {
  const { since } = await loadDataWindow();
  return `min_unix_timestamp=${since}${rank === 'high' ? '&min_average_badge=90' : ''}`;
}

const loadMeta = rank => once(`meta:${rank}`, async () => {
  const filter = await matchFilter(rank);
  const [rows, heroStats] = await Promise.all([
    getJSON(`${API}/analytics/item-stats?bucket=hero&${filter}`),
    getJSON(`${API}/analytics/hero-stats?${filter}`),
  ]);
  const byHero = new Map();
  let hit = 0, miss = 0, heroMatches = 0;
  for (const h of heroStats) {
    byHero.set(h.hero_id, { matches: h.matches, wins: h.wins, items: [] });
    hit += h.total_shots_hit ?? 0;
    miss += h.total_shots_missed ?? 0;
    heroMatches += h.matches;
  }
  for (const r of rows) byHero.get(r.bucket)?.items.push(r);
  // Every match has 12 heroes, so this is the number of matches in the sample.
  return { byHero, accuracy: hit + miss ? hit / (hit + miss) : 0.5, totalMatches: heroMatches / 12 };
});

async function mapLimit(list, limit, fn) {
  const out = new Array(list.length);
  let next = 0;
  await Promise.all(Array.from({ length: limit }, async () => {
    while (next < list.length) {
      const i = next++;
      out[i] = await fn(list[i]).catch(() => null);
    }
  }));
  return out;
}

// Most common real-match ability order per hero (unlocks and upgrades as a list of ability ids).
const loadAbilityOrders = (rank, heroes) => once(`ao:${rank}`, async () => {
  const filter = await matchFilter(rank);
  const results = await mapLimit(heroes, 6, h => getJSON(`${API}/analytics/ability-order-stats?hero_id=${h.id}&min_matches=20&${filter}`));
  const orders = new Map();
  heroes.forEach((h, i) => {
    const rows = results[i];
    if (Array.isArray(rows) && rows.length) orders.set(h.id, rows.reduce((a, b) => (b.matches > a.matches ? b : a)).abilities);
  });
  return orders;
});

/* loadouts */

function metaOrder(heroId, meta = MU.data.meta) {
  const h = meta.byHero.get(heroId);
  if (!h) return [];
  return h.items
    .filter(r => r.matches / h.matches >= META_MIN_PICK && isShopItem(r.item_id))
    .sort((a, b) => a.avg_buy_time_s - b.avg_buy_time_s)
    .map(r => r.item_id);
}

// The build's items in purchase order: core categories first, then (if included) the optional
// ones, which fill the remaining slots once the souls allow.
function buildOrder(build) {
  const cats = build.details?.mod_categories ?? [];
  const ordered = [...cats.filter(c => !c.optional), ...(MU.optional ? cats.filter(c => c.optional) : [])];
  const ids = [];
  for (const cat of ordered) {
    for (const m of cat.mods ?? []) if (!ids.includes(m.ability_id) && isShopItem(m.ability_id)) ids.push(m.ability_id);
  }
  return ids;
}

// Buys items in order until the next one doesn't fit the souls. Upgrades consume their
// components, and a full inventory sells its cheapest item to make room.
function loadoutAt(order, souls, excluded = new Set()) {
  const held = [];
  let value = 0;
  for (const id of order) {
    if (excluded.has(id)) continue;
    const item = state.assets.byId.get(id);
    if (!item || held.includes(item)) continue;
    const parts = (item.component_items ?? []).map(c => state.assets.byClass.get(c)).filter(c => c && held.includes(c));
    const after = value - parts.reduce((s, c) => s + c.cost, 0) + item.cost;
    if (after > souls) break;
    for (const c of parts) held.splice(held.indexOf(c), 1);
    if (held.length >= MAX_ITEMS) held.splice(held.indexOf(held.reduce((a, b) => (a.cost <= b.cost ? a : b))), 1);
    held.push(item);
    value = held.reduce((s, it) => s + it.cost, 0);
  }
  return held;
}

/* item effects */

const SELF_STATS = {
  BaseAttackDamagePercent: 'weaponPct', BonusFireRate: 'fireRatePct', ActivatedFireRate: 'fireRatePct',
  BonusClipSizePercent: 'clipPct', BonusClipSize: 'clipFlat',
  TechPower: 'spirit', SpiritPower: 'spirit', SpiritPowerInnate: 'spirit', BonusSpirit: 'spirit', TechPowerPercent: 'spiritPct',
  BonusAttackRangePercent: 'rangePct', BonusHealth: 'bonusHealth', BonusBaseHealth: 'baseHealthPct', MaxHealthLossPercent: 'maxHealthPct',
  BulletResist: 'bulletResist', TechResist: 'spiritResist', CooldownReduction: 'cdr',
  BulletLifestealPercent: 'bulletLifesteal', AbilityLifestealPercentHero: 'spiritLifesteal',
  AbilityLifestealPercentHeroPassive: 'spiritLifesteal', BonusSpiritLifesteal: 'spiritLifesteal',
};
const DEBUFF_STATS = {
  BulletArmorReduction: 'bulletResist', TechArmorDamageReduction: 'spiritResist', MagicResistReduction: 'spiritResist',
  FireRateSlow: 'fireRatePct', TechDamageReduction: 'spiritDamagePct', TechPowerReduction: 'spirit',
  HealAmpReceivePenaltyPercent: 'healPct', HealAmpRegenPenaltyPercent: 'healPct',
};
// These describe you in an item's always-on section but the enemy in its conditional sections.
const SELF_OR_ENEMY = { OutgoingDamagePenaltyPercent: 'damagePct', BulletResistReduction: 'bulletResist' };
const PERMANENT = new Set(['bonusHealth', 'baseHealthPct', 'maxHealthPct']);
const DURATION_KEYS = ['AbilityDuration', 'BuffDuration', 'BarrierDuration', 'DebuffDuration'];
const STAT_TEXT = {
  weaponPct: '% weapon damage', fireRatePct: '% fire rate', clipPct: '% ammo', clipFlat: ' ammo', spirit: ' spirit power',
  spiritPct: '% spirit power', rangePct: '% falloff range', bonusHealth: ' health', baseHealthPct: '% base health',
  maxHealthPct: '% max health', bulletResist: '% bullet resist', spiritResist: '% spirit resist', cdr: '% cooldown reduction',
  bulletLifesteal: '% bullet lifesteal', spiritLifesteal: '% spirit lifesteal', damagePct: '% damage dealt',
  spiritDamagePct: '% spirit damage dealt', healPct: '% healing received',
};

function sectionKeys(sec) {
  const keys = new Set();
  for (const a of sec.section_attributes ?? []) {
    for (const k of [...(a.properties ?? []), ...(a.elevated_properties ?? []), ...(a.important_properties ?? [])]) keys.add(k);
  }
  return keys;
}

const itemFxCache = new Map();
function itemCombatEffects(item) {
  if (itemFxCache.has(item.id)) return itemFxCache.get(item.id);
  const P = item.properties ?? {};
  const fx = { self: [], debuffs: [], procs: [], headshots: [], perBullet: [], casts: [], bleeds: [], amps: [], barrier: 0, buildup: false, notes: [], partial: false };
  for (const sec of item.tooltip_sections ?? []) {
    const type = sec.section_type ?? 'innate';
    const keys = sectionKeys(sec);
    const val = k => (keys.has(k) ? num(P[k]?.value) : 0);
    const has = k => val(k) !== 0;
    const duration = DURATION_KEYS.map(val).find(x => x > 0) ?? 0;
    const cooldown = val('AbilityCooldown');
    const uptime = cooldown > 0 && duration > 0 ? Math.min(1, duration / cooldown) : 1;
    const phase = keys.has('BuildUpPerShot') ? 1 : 0;
    const timing = [
      phase && 'after build-up',
      uptime < 1 && `averaged: ${pct(uptime)} uptime`,
      type !== 'innate' && uptime === 1 && !phase && 'assumed active in fights',
    ].filter(Boolean).join(', ');
    const tag = timing ? ` (${timing})` : '';
    let handled = false;
    const add = (list, entry, text) => { list.push(entry); fx.notes.push(text + tag); handled = true; };
    if (phase) fx.buildup = true;

    for (const key of keys) {
      const v = val(key);
      if (!v) continue;
      const selfStat = SELF_STATS[key] ?? (type === 'innate' ? SELF_OR_ENEMY[key] : null);
      const enemyStat = DEBUFF_STATS[key] ?? (type !== 'innate' ? SELF_OR_ENEMY[key] : null);
      if (selfStat) {
        const amount = PERMANENT.has(selfStat) ? v : v * uptime;
        add(fx.self, { stat: selfStat, value: amount, phase, basic: type === 'innate' && uptime === 1 && !phase }, signed(amount, STAT_TEXT[selfStat]));
      } else if (enemyStat) {
        const amount = (key === 'FireRateSlow' ? -Math.abs(v) : v) * uptime;
        add(fx.debuffs, { stat: enemyStat, value: amount, phase }, `enemy ${signed(amount, STAT_TEXT[enemyStat])}`);
      }
    }
    if (has('CloseRangeBonusWeaponPower')) {
      const r = val('CloseRangeBonusDamageRange') || 15;
      add(fx.self, { stat: 'weaponPct', value: val('CloseRangeBonusWeaponPower'), phase, maxRange: r }, `${signed(val('CloseRangeBonusWeaponPower'), '% weapon damage')} within ${fmt1(r)}m`);
    }
    if (has('LongRangeBonusWeaponPower')) {
      const r = val('LongRangeBonusWeaponPowerMinRange') || 15;
      add(fx.self, { stat: 'weaponPct', value: val('LongRangeBonusWeaponPower'), phase, minRange: r }, `${signed(val('LongRangeBonusWeaponPower'), '% weapon damage')} beyond ${fmt1(r)}m`);
    }
    if (has('CritDamagePercent') && has('ProcChance')) {
      const expected = (val('CritDamagePercent') * val('ProcChance')) / 100;
      add(fx.self, { stat: 'weaponPct', value: expected, phase }, `${val('ProcChance')}% chance for ${signed(val('CritDamagePercent'), '%')} damage (≈ ${signed(expected, '% weapon damage')})`);
    }
    const procCooldown = val('ProcCooldown') || cooldown;
    const chance = has('ProcChance') ? val('ProcChance') / 100 : 1;
    for (const key of ['ProcBonusMagicDamage', 'DamagePerChain']) {
      if (!has(key)) continue;
      const dmg = spiritScaled(P[key]);
      add(fx.procs, { dmg, type: 'spirit', chance, cooldown: procCooldown, phase, source: 'items' },
        `${fmtSv(dmg)} spirit damage on hit${chance < 1 ? ` (${pct(chance)} chance)` : ''}${procCooldown ? `, at most every ${fmt1(procCooldown)}s` : ''}`);
    }
    if (has('HealthStealPctHero')) {
      const cd = val('ProcCooldown') || 1;
      add(fx.procs, { pctMaxHp: val('HealthStealPctHero'), type: 'spirit', chance: 1, cooldown: cd, steal: true, phase, source: 'items' }, `steals ${fmt1(val('HealthStealPctHero'))}% of max health on hit, at most every ${fmt1(cd)}s`);
    }
    if (has('HeadShotBonusDamage')) {
      add(fx.headshots, { dmg: val('HeadShotBonusDamage'), cooldown: procCooldown }, `+${fmt1(val('HeadShotBonusDamage'))} damage on headshot${procCooldown ? `, at most every ${fmt1(procCooldown)}s` : ''}`);
    }
    if (has('BulletsBonusMagicDamage')) {
      // With a charge-up (Mercurial Magnum) the bonus covers one empowered magazine per charge.
      const dmg = spiritScaled(P.BulletsBonusMagicDamage);
      const chargeUp = val('AbilityChargeUpTime');
      add(fx.perBullet, { dmg, uptime, chargeUp, phase, source: 'items' },
        `${fmtSv(dmg)} spirit damage per bullet${chargeUp ? `, for one magazine every ${fmt1(chargeUp)}s charge-up` : ''}`);
    }
    if (has('DotHealthPercent')) {
      const dmg = spiritScaled(P.DotHealthPercent);
      add(fx.bleeds, { pct: dmg, phase }, `bleed: ${fmtSv(dmg)}% of max health per second`);
    }
    if (has('MagicIncreasePerStack')) {
      const max = val('MaxStacks') || 1, cd = val('ProcCooldown') || 1;
      add(fx.amps, { perStack: val('MagicIncreasePerStack'), max, cooldown: cd, phase }, `enemy takes ${signed(val('MagicIncreasePerStack'), '%')} spirit damage per stack (up to ${max}, one per ${fmt1(cd)}s)`);
    }
    if (has('CombatBarrier')) {
      fx.barrier += val('CombatBarrier');
      fx.notes.push(`${fmt1(val('CombatBarrier'))} barrier at the start of a fight`);
      handled = true;
    }
    if (type === 'active' && (has('DPS') || has('Damage'))) {
      const instant = has('Damage') ? [spiritScaled(P.Damage)] : [];
      const dps = has('DPS') ? [spiritScaled(P.DPS)] : [];
      const dur = val('AbilityDuration') || DOT_FALLBACK_SECONDS;
      add(fx.casts, { name: item.name, source: 'items', instant, dps, duration: dur, cooldown: Math.max(cooldown || 30, MIN_CAST_COOLDOWN), charges: 1 },
        `active: ${[...instant.map(sv => `${fmtSv(sv)} damage`), ...dps.map(sv => `${fmtSv(sv)} damage/s for ${fmt1(dur)}s`)].join(' + ')}, used every ${fmt1(cooldown || 30)}s`);
    }
    if (!handled && type !== 'innate' && keys.size) fx.partial = true;
  }
  itemFxCache.set(item.id, fx);
  return fx;
}

/* abilities */

const heroAbilities = hero => ['signature1', 'signature2', 'signature3', 'signature4']
  .map(slot => state.assets.byClass.get(hero.items?.[slot])).filter(Boolean);

const buildAbilitySequence = build => (build.details?.ability_order?.currency_changes ?? []).map(c => c.ability_id);

function defaultAbilitySequence(hero) {
  const ids = heroAbilities(hero).map(a => a.id);
  return [...ids, ...ids, ...ids, ...ids];
}

// Which abilities are unlocked/upgraded at a souls amount, following an ability order strictly.
function abilityTiersAt(hero, souls, sequence) {
  let unlocks = 0, points = 0;
  for (const level of Object.values(hero.level_info ?? {})) {
    if ((level.required_gold ?? 0) > souls) continue;
    for (const c of level.bonus_currencies ?? []) {
      if (c === 'EAbilityUnlocks') unlocks++;
      else if (c === 'EAbilityPoints') points++;
    }
  }
  const tiers = new Map();
  for (const id of sequence) {
    if (!tiers.has(id)) {
      if (unlocks < 1) break;
      unlocks--;
      tiers.set(id, 0);
    } else {
      const next = tiers.get(id) + 1;
      if (next > 3) continue;
      if (points < AP_COST[next]) break;
      points -= AP_COST[next];
      tiers.set(id, next);
    }
  }
  return tiers;
}

function abilityValue(ability, key, tier) {
  const p = ability.properties?.[key];
  if (!p) return null;
  let base = num(p.value);
  let scale = p.scale_function?.specific_stat_scale_type === 'ETechPower' ? num(p.scale_function.stat_scale) : 0;
  for (let i = 0; i < tier; i++) {
    for (const u of ability.upgrades?.[i]?.property_upgrades ?? []) {
      if (u.name !== key) continue;
      if (u.upgrade_type === 'EAddToScale') { if (!u.scale_stat_filter || u.scale_stat_filter === 'ETechPower') scale += num(u.bonus); }
      else base += num(u.bonus);
    }
  }
  return { base, scale, css: p.css_class ?? '' };
}

// The stats the game's own tooltip highlights for an ability.
function abilityKeys(ability) {
  const keys = new Set();
  for (const s of ability.tooltip_details?.info_sections ?? []) {
    for (const block of s.properties_block ?? []) for (const p of block.properties ?? []) if (p.important_property) keys.add(p.important_property);
    for (const k of s.basic_properties ?? []) keys.add(k);
  }
  if (!keys.size) for (const k of Object.keys(ability.properties ?? {})) keys.add(k);
  return keys;
}

const AB_SKIP = /(Percent|Pct|Penalty|Threshold|Radius|Range|PerKill|PerPlayer|PerMeter|LowHealth|Self|Summon|Gravestone|Cap|Mult|Rage|Interval|Delay|Duration|Time|Bonus|Heal|Reduction|Amplification|Uppercut|Melee|Resist)/;
const DUR_SKIP = /(Slow|Stun|Reveal|Immunity|Barrier|MoveSpeed|Movement|Lift|Hold|Whirlwind|Recast|Channel|Cast|Buff|Fade|Invis|Silence|Disarm|Sleep|Cooldown|Ability)/;

// How long an ability's effect lasts: a summon's lifetime first, then its own effect durations.
function abilityDuration(ability, tier, keys) {
  const props = Object.keys(ability.properties ?? {});
  const lifetimes = props.filter(k => /Lifetime$/.test(k));
  const durations = props.filter(k => /Duration$/.test(k) && !DUR_SKIP.test(k));
  for (const list of [lifetimes, durations]) {
    const pick = list.find(k => keys.has(k)) ?? list[0];
    const d = pick ? abilityValue(ability, pick, tier).base : 0;
    if (d > 0) return d;
  }
  const own = abilityValue(ability, 'AbilityDuration', tier)?.base ?? 0;
  return own > 0 ? own : DOT_FALLBACK_SECONDS;
}

const SUMMON_HITS_PER_SECOND = 1; // the data gives summons' damage per hit but not how often they hit
const SUMMON_FIGHT_SECONDS = 8; // summons have little health, so they don't survive their full lifetime in a fight

const abilityCache = new Map();
function abilityModel(hero, ability, tier) {
  const cacheKey = `${ability.id}:${tier}`;
  if (abilityCache.has(cacheKey)) return abilityCache.get(cacheKey);
  const keys = abilityKeys(ability);
  const props = Object.keys(ability.properties ?? {});
  const v = k => abilityValue(ability, k, tier);
  let cooldown = v('AbilityCooldown')?.base ?? 0;
  let charges = Math.max(1, Math.round(v('AbilityCharges')?.base ?? 1));
  const chargeGap = Math.max(0, v('AbilityCooldownBetweenCharge')?.base ?? 0);
  // Abilities whose charges come from a resource (Jar of Dead) can be used once per charge gap.
  if (cooldown < MIN_CAST_COOLDOWN && chargeGap >= MIN_CAST_COOLDOWN) { cooldown = chargeGap; charges = 1; }
  const duration = abilityDuration(ability, tier, keys);
  const uptime = cooldown > 0 ? Math.min(1, duration / cooldown) : 1;
  const m = {
    ability, tier, cooldown, duration, uptime, charges,
    chargeGap: chargeGap > 0 && chargeGap < cooldown ? chargeGap : 0,
    ult: hero.items?.signature4 === ability.class_name,
    instant: [], dps: [], perBullet: [], procs: [], debuffs: [], selfBuffs: [],
  };
  const pairs = new Map();
  for (const key of keys) {
    const p = v(key);
    if (!p) continue;
    // Stats stolen by sustained shooting (Essence Theft) apply once the build-up is done.
    if (key === 'MaxStolenAttackDamage') { m.selfBuffs.push({ stat: 'weaponPct', value: p.base, scale: p.scale, phase: 1 }); continue; }
    if (key === 'MaxStolenSpiritResist') { m.debuffs.push({ stat: 'spiritResist', value: -Math.abs(p.base), phase: 1 }); continue; }
    const debuffStat = DEBUFF_STATS[key] ?? SELF_OR_ENEMY[key];
    if (debuffStat) {
      if (p.base) m.debuffs.push({ stat: debuffStat, value: (key === 'FireRateSlow' ? -Math.abs(p.base) : p.base) * uptime, phase: 0 });
      continue;
    }
    if (!(p.base > 0 || p.scale > 0) || !/Damage|DPS|PerSecond/.test(key) || /melee|distance|duration/.test(p.css)) continue;
    const isDot = /DPS|PerSecond/.test(key);
    if (/PerStack/.test(key) && !isDot) continue;
    if (AB_SKIP.test(key.replace('DPSPerStack', 'DPS'))) continue;
    const sv = { base: p.base, scale: p.scale, type: p.css === 'bullet_damage' ? 'bullet' : 'spirit', steal: p.css === 'healing' };
    if (/PerBullet|PerChain/.test(key)) { m.perBullet.push(sv); continue; }
    if (/^Proc.*Damage/.test(key)) {
      m.procs.push({ dmg: sv, type: sv.type, chance: (v('ProcChance')?.base || 100) / 100, cooldown: v('ProcCooldown')?.base || cooldown });
      continue;
    }
    if (/Min|Max/.test(key)) {
      const group = key.replace(/Min|Max/, '');
      if (!pairs.has(group)) pairs.set(group, { list: [], isDot });
      pairs.get(group).list.push(sv);
      continue;
    }
    (isDot ? m.dps : m.instant).push(sv);
  }
  for (const { list, isDot } of pairs.values()) {
    const avg = { base: list.reduce((s, x) => s + x.base, 0) / list.length, scale: list.reduce((s, x) => s + x.scale, 0) / list.length, type: list[0].type };
    (isDot ? m.dps : m.instant).push(avg);
  }
  // Summons: damage counts once per summon, and per-hit damage turns into damage over their lifetime.
  const countKey = props.find(k => /^(Skull|Summon|Helper|Zombie|Minion)Count$/.test(k));
  const count = countKey ? Math.max(1, Math.round(v(countKey).base)) : 1;
  const times = (sv, n) => ({ ...sv, base: sv.base * n, scale: sv.scale * n });
  if (count > 1) { m.instant = m.instant.map(sv => times(sv, count)); m.dps = m.dps.map(sv => times(sv, count)); }
  const lifetimeKey = props.find(k => /Lifetime$/.test(k));
  if (countKey && lifetimeKey && v(lifetimeKey).base > 0 && m.instant.length && !m.dps.length) {
    m.dps = m.instant.map(sv => times(sv, SUMMON_HITS_PER_SECOND));
    m.instant = [];
    m.duration = v(lifetimeKey).base;
    m.summon = count;
  }
  if (props.some(k => /^(Summon|Turret|Skull|Helper|Zombie)(Base)?Health$/.test(k))) m.duration = Math.min(m.duration, SUMMON_FIGHT_SECONDS);
  // Abilities charged by landing bullets (Card Trick) or by taking damage (Pain Battery).
  const perHitKey = props.find(k => /ResourcePerBulletHit$/.test(k));
  const costKey = ['ResourcePerCard', 'ResourceCost'].find(k => (v(k)?.base ?? 0) > 0);
  if (perHitKey && costKey && m.instant.length) m.resource = { perHit: v(perHitKey).base, cost: v(costKey).base };
  const battery = v('StoredDamageHealthPercentRequired')?.base ?? 0;
  if (battery > 0 && m.instant.length) m.battery = battery;
  // Other abilities without a real cooldown are passives or stack mechanics that can't be cast on a
  // timer. A no-cooldown burn becomes a constant burn while attacking; the rest is skipped.
  if (!m.resource && !m.battery) {
    if (cooldown === 0 && m.dps.length) { m.aura = m.dps; m.dps = []; }
    if (cooldown < MIN_CAST_COOLDOWN && m.instant.length) { m.skipped = 'recharges too fast to model as casts'; m.instant = []; }
    if (cooldown > 0 && cooldown < MIN_CAST_COOLDOWN && m.dps.length) { m.skipped = 'recharges too fast to model as casts'; m.dps = []; }
  }
  m.procs = m.procs.filter(p => p.cooldown > 0);
  m.aura ??= [];
  m.modeled = m.instant.length + m.dps.length + m.aura.length + m.perBullet.length + m.procs.length + m.debuffs.length + m.selfBuffs.length > 0;
  abilityCache.set(cacheKey, m);
  return m;
}

function abilitySummary(m, spirit) {
  if (!m) return 'locked';
  const parts = [];
  const sum = list => list.reduce((s, sv) => s + atSpirit(sv, spirit), 0);
  if (m.instant.length) parts.push(`${Math.round(sum(m.instant))} dmg`);
  if (m.dps.length) parts.push(`${Math.round(sum(m.dps))}/s for ${fmt1(m.duration)}s${m.summon ? ` (${m.summon} summons)` : ''}`);
  if (m.aura.length) parts.push(`${Math.round(sum(m.aura))}/s while attacking`);
  if (m.perBullet.length) parts.push(`+${fmt1(sum(m.perBullet))} per bullet (${pct(m.uptime)} uptime)`);
  for (const p of m.procs) parts.push(`${Math.round(atSpirit(p.dmg, spirit))} on hit, every ${fmt1(p.cooldown)}s max`);
  for (const b of m.selfBuffs) parts.push(`${signed(b.value + (b.scale ?? 0) * spirit, STAT_TEXT[b.stat])} after sustained fire`);
  for (const d of m.debuffs) parts.push(`enemy ${signed(d.value, STAT_TEXT[d.stat])}`);
  if (!parts.length) return m.skipped ? `not modeled (${m.skipped})` : 'no damage modeled';
  if (m.resource) parts.push(`one use per ${Math.round(m.resource.cost / m.resource.perHit)} bullet hits`);
  else if (m.battery) parts.push(`once charged by taking ${fmt1(m.battery)}% of max health`);
  else if ((m.instant.length || m.dps.length) && m.cooldown > 0) parts.push(`every ${fmt1(Math.max(m.cooldown, m.instant.length ? MIN_CAST_COOLDOWN : 0))}s${m.charges > 1 ? ` (${m.charges} charges)` : ''}`);
  return parts.join(', ');
}

/* fighters */

function buildFighter(hero, held, souls, sequence, opts) {
  const weapon = state.assets.byClass.get(hero.items?.weapon_primary)?.weapon_info;
  if (!weapon?.bullets_per_second) return null;
  const up = hero.standard_level_up_upgrades ?? {};
  const reached = Object.values(hero.level_info ?? {}).filter(l => (l.required_gold ?? 0) <= souls);
  const boons = reached.filter(l => l.use_standard_upgrade).length;
  const withItems = opts.mode !== 'gun';
  const F = {
    hero, weapon, held, souls, boons, up, level: reached.length,
    self: [], debuffs: [], procs: [], headshots: [], perBullet: [], casts: [], bleeds: [], amps: [], auras: [],
    barrier: 0, buildup: false, partial: [], abilities: [], spend: { weapon: 0, vitality: 0, spirit: 0 },
  };
  for (const item of held) {
    F.spend[item.item_slot_type] = (F.spend[item.item_slot_type] ?? 0) + item.cost;
    const fx = itemCombatEffects(item);
    if (!withItems) { F.self.push(...fx.self.filter(m => m.basic)); continue; }
    F.self.push(...fx.self);
    F.debuffs.push(...fx.debuffs);
    F.procs.push(...fx.procs);
    F.headshots.push(...fx.headshots);
    F.perBullet.push(...fx.perBullet);
    F.casts.push(...fx.casts);
    F.bleeds.push(...fx.bleeds);
    F.amps.push(...fx.amps);
    F.barrier += fx.barrier;
    F.buildup ||= fx.buildup;
    if (fx.partial) F.partial.push(item);
  }
  if (opts.mode === 'full') {
    const tiers = abilityTiersAt(hero, souls, sequence);
    for (const ability of heroAbilities(hero)) {
      const tier = tiers.get(ability.id);
      const m = tier == null ? null : abilityModel(hero, ability, tier);
      const off = !!m && ((m.ult && !opts.ultimates) || !!opts.excludedAbilities?.has(ability.id));
      F.abilities.push({ ability, tier: tier ?? -1, model: m, off });
      if (!m || off) continue;
      if (m.instant.length || m.dps.length) {
        F.casts.push({ name: ability.name, source: 'abilities', instant: m.instant, dps: m.dps, duration: m.duration,
          cooldown: Math.max(m.cooldown, MIN_CAST_COOLDOWN), charges: m.charges, chargeGap: m.chargeGap,
          resource: m.resource, battery: m.battery, ability: true });
      }
      F.self.push(...m.selfBuffs);
      F.buildup ||= m.selfBuffs.some(b => b.phase) || m.debuffs.some(d => d.phase);
      F.auras.push(...m.aura);
      F.perBullet.push(...m.perBullet.map(dmg => ({ dmg, uptime: m.uptime, phase: 0, source: 'abilities' })));
      F.procs.push(...m.procs.map(p => ({ ...p, phase: 0, source: 'abilities' })));
      F.debuffs.push(...m.debuffs);
    }
  }
  return F;
}

function fighterStats(F, phase, range) {
  const { weapon, up, boons, hero } = F;
  const sum = { weaponPct: 0, fireRatePct: 0, clipPct: 0, clipFlat: 0, spirit: 0, spiritPct: 0, rangePct: 0, bonusHealth: 0, baseHealthPct: 0,
    maxHealthPct: 0, damagePct: 0, cdr: 0, bulletLifesteal: 0, spiritLifesteal: 0 };
  const bulletResist = [boons * (up.MODIFIER_VALUE_BULLET_ARMOR_DAMAGE_RESIST ?? 0)];
  const spiritResist = [boons * (up.MODIFIER_VALUE_TECH_RESIST ?? 0)];
  for (const m of F.self) {
    if (m.phase > phase || (m.maxRange && range > m.maxRange) || (m.minRange && range < m.minRange)) continue;
    if (m.stat === 'bulletResist') bulletResist.push(m.value);
    else if (m.stat === 'spiritResist') spiritResist.push(m.value);
    else if (m.stat in sum) sum[m.stat] += m.value;
  }
  // Shop "tier bonus" for souls spent in each category: weapon damage %, base health %, spirit power.
  const tierBonus = slot => (hero.cost_bonuses?.[slot] ?? []).reduce((b, t) => (F.spend[slot] >= t.gold_threshold ? t.bonus : b), 0);
  const spirit = (boons * (up.MODIFIER_VALUE_TECH_POWER ?? 0) + sum.spirit + tierBonus('spirit')) * (1 + sum.spiritPct / 100);
  // Ability buffs that scale with spirit power (Essence Theft's stolen weapon damage).
  for (const m of F.self) if (m.scale && !(m.phase > phase) && m.stat in sum && m.stat !== 'spirit') sum[m.stat] += m.scale * spirit;
  const spiritScale = stat => (hero.scaling_stats?.[stat]?.scaling_stat === 'ETechPower' ? hero.scaling_stats[stat].scale * spirit : 0);
  const pellets = weapon.bullets || 1;
  const baseShots = weapon.bullets_per_second / pellets;
  // The API's with-reload rate includes a short delay before reloading starts; recover it per weapon.
  const withReload = (weapon.bullets_per_second_with_reload ?? 0) / pellets;
  const delay = withReload ? weapon.clip_size / withReload - weapon.clip_size / baseShots - weapon.reload_duration : NaN;
  const baseHealth = statValue(hero.starting_stats?.max_health) + boons * (up.MODIFIER_VALUE_BASE_HEALTH_FROM_LEVEL ?? 0);

  const dist = range * UNITS_PER_METER;
  const rangeMult = 1 + sum.rangePct / 100;
  const fStart = weapon.damage_falloff_start_range * rangeMult, fEnd = weapon.damage_falloff_end_range * rangeMult;
  const fall = fEnd > fStart ? clamp01((dist - fStart) / (fEnd - fStart)) : dist > fStart ? 1 : 0;
  const s0 = weapon.damage_falloff_start_scale ?? 1, s1 = weapon.damage_falloff_end_scale ?? 1;
  const critT = weapon.crit_bonus_end_range > weapon.crit_bonus_start_range
    ? clamp01((dist - weapon.crit_bonus_start_range) / (weapon.crit_bonus_end_range - weapon.crit_bonus_start_range)) : 0;
  const c0 = weapon.crit_bonus_start ?? 1, c1 = weapon.crit_bonus_end ?? c0;

  return {
    spirit,
    weaponPct: sum.weaponPct + tierBonus('weapon'),
    bullet: (weapon.bullet_damage + boons * (up.MODIFIER_VALUE_BASE_BULLET_DAMAGE_FROM_LEVEL ?? 0) + spiritScale('EBulletDamage'))
      * (1 + (sum.weaponPct + tierBonus('weapon')) / 100) * (1 + sum.damagePct / 100),
    pellets,
    shotsPerSec: baseShots * Math.max(0.1, 1 + sum.fireRatePct / 100),
    clip: Math.max(1, Math.round(weapon.clip_size * (1 + sum.clipPct / 100) + sum.clipFlat + spiritScale('EClipSize'))),
    reload: weapon.reload_duration + (delay > -0.05 && delay < 2 ? Math.max(0, delay) : RELOAD_DELAY_FALLBACK),
    falloff: s0 + (s1 - s0) * fall,
    crit: c0 + (c1 - c0) * critT,
    health: (baseHealth * (1 + (tierBonus('vitality') + sum.baseHealthPct) / 100) + sum.bonusHealth) * (1 + sum.maxHealthPct / 100),
    bulletResistSources: bulletResist,
    spiritResistSources: spiritResist,
    spiritAmp: boons * (up.MODIFIER_VALUE_TECH_DAMAGE_MULTIPLIER ?? 0),
    cdr: Math.min(sum.cdr, 80),
    damagePct: sum.damagePct,
    bulletLifesteal: sum.bulletLifesteal,
    spiritLifesteal: sum.spiritLifesteal,
    critTaken: statValue(hero.starting_stats?.crit_damage_received_scale) || 1,
  };
}

const combineResist = sources => 1 - sources.reduce((m, r) => m * (1 - r / 100), 1);

/* simulation */

function debuffTotals(F, phase) {
  const t = { bulletResist: [], spiritResist: [], fireRatePct: 0, spiritDamagePct: 0, spirit: 0, healPct: 0, damagePct: 0 };
  for (const d of F.debuffs) {
    if (d.phase > phase) continue;
    if (d.stat === 'bulletResist' || d.stat === 'spiritResist') t[d.stat].push(d.value);
    else if (d.stat in t) t[d.stat] += d.value;
  }
  return t;
}

function makeSide(F, opts) {
  const stats = [0, 1].map(phase => fighterStats(F, phase, opts.range));
  const debuffs = [0, 1].map(phase => debuffTotals(F, phase));
  return {
    F, stats, debuffs, phase: 0,
    hp: stats[0].health, maxHp: stats[0].health, barrier: F.barrier,
    ammo: stats[0].clip, nextShot: 0, reloadEnd: 0,
    buildupAt: F.buildup ? BUILDUP_SECONDS / Math.max(opts.accuracy, 0.1) : Infinity,
    casts: F.casts.map(c => ({ ...c, maxCharges: c.charges, casts: 0, recharge: [], nextAllowed: 0, stored: 0 })),
    dots: new Map(), ampStacks: 0, ampNext: 0, killTime: null, taken: 0,
    bySource: { gun: 0, items: 0, abilities: 0 },
  };
}

// Both sides fight at once (and keep going after a death) so each gets a time to kill.
function simulate(A, B, opts, maxTime = SIM_MAX) {
  const a = makeSide(A, opts), b = B.dummy ? makeDummy(B.health) : makeSide(B, opts);
  a.enemy = b; b.enemy = a;
  const sides = B.dummy ? [a] : [a, b];
  for (let t = 0; t < maxTime; t += SIM_STEP) {
    for (const s of sides) stepSide(s, t, opts);
    if (a.killTime != null && (B.dummy || b.killTime != null)) break;
  }
  return { you: a.killTime, them: b.killTime, a, b };
}

// A training target that never dies. Its max health (for "% of max health" effects) defaults to
// a typical late-game hero's.
const DUMMY_HEALTH = 3500;
function makeDummy(health = DUMMY_HEALTH) {
  const stats = { health, bulletResistSources: [], spiritResistSources: [], critTaken: 1 };
  const none = debuffTotals({ debuffs: [] }, 0);
  return { dummy: true, stats: [stats, stats], debuffs: [none, none], phase: 0, hp: Infinity, maxHp: health, barrier: 0, killTime: null, taken: 0 };
}

function stepSide(s, t, opts) {
  const o = s.enemy;
  if (t >= s.buildupAt) s.phase = 1;
  const st = s.stats[s.phase];
  const ot = o.stats[o.phase];
  const mine = s.debuffs[s.phase]; // what I do to the enemy
  const theirs = o.debuffs[o.phase]; // what the enemy does to me
  const spirit = Math.max(0, st.spirit + theirs.spirit);
  const resistBullet = combineResist([...ot.bulletResistSources, ...mine.bulletResist]);
  const resistSpirit = combineResist([...ot.spiritResistSources, ...mine.spiritResist]);
  const outMult = Math.max(0, 1 + theirs.damagePct / 100);
  const spiritOutMult = outMult * Math.max(0, 1 + theirs.spiritDamagePct / 100) * (1 + st.spiritAmp / 100);
  const healMult = Math.max(0, 1 + theirs.healPct / 100);
  const amp = s.F.amps.length ? 1 + (s.ampStacks * s.F.amps[0].perStack) / 100 : 1;

  const deal = (amount, type, source, steal = false) => {
    if (!(amount > 0)) return;
    let dmg = type === 'bullet' ? amount * (1 - resistBullet) * outMult : amount * (1 - resistSpirit) * spiritOutMult * amp;
    const absorbed = Math.min(o.barrier, dmg);
    o.barrier -= absorbed;
    o.hp -= dmg - absorbed;
    o.taken += dmg;
    s.bySource[source] += dmg;
    const lifesteal = steal ? 100 : type === 'bullet' ? st.bulletLifesteal : st.spiritLifesteal;
    if (lifesteal) s.hp = Math.min(s.maxHp, s.hp + dmg * (lifesteal / 100) * healMult);
    if (o.hp <= 0 && s.killTime == null) s.killTime = t;
    if (type === 'spirit' && s.F.amps.length && t >= s.ampNext) {
      s.ampStacks = Math.min(s.F.amps[0].max, s.ampStacks + 1);
      s.ampNext = t + s.F.amps[0].cooldown;
    }
  };

  // Gun, with on-hit procs as expected values per shot.
  const shotsPerSec = st.shotsPerSec * Math.max(0.1, 1 + theirs.fireRatePct / 100);
  if (s.reloadEnd && t >= s.reloadEnd) { s.ammo = st.clip; s.reloadEnd = 0; }
  while (!s.reloadEnd && s.nextShot <= t) {
    const headshot = 1 + opts.headshot * (st.crit - 1) * ot.critTaken;
    deal(st.bullet * st.pellets * st.falloff * headshot * opts.accuracy, 'bullet', 'gun');
    const rate = (p, cd) => (cd > 0 ? Math.min(p, 1 / (cd * shotsPerSec)) : p);
    for (const p of s.F.procs) {
      if (p.phase > s.phase) continue;
      const f = rate(opts.accuracy * p.chance, p.cooldown);
      const dmg = p.pctMaxHp ? (p.pctMaxHp / 100) * o.maxHp : atSpirit(p.dmg, spirit);
      deal(dmg * f, p.type ?? 'spirit', p.source ?? 'items', p.steal);
    }
    for (const h of s.F.headshots) deal(h.dmg * rate(opts.accuracy * opts.headshot, h.cooldown), 'bullet', 'items');
    const magazineTime = st.clip / shotsPerSec;
    for (const b of s.F.perBullet) {
      if (b.phase > s.phase) continue;
      const share = b.chargeUp ? magazineTime / (b.chargeUp + magazineTime) : b.uptime;
      deal(atSpirit(b.dmg, spirit) * share * opts.accuracy, 'spirit', b.source);
    }
    for (const c of s.casts) if (c.resource) c.stored += c.resource.perHit * st.pellets * opts.accuracy;
    s.ammo--;
    s.nextShot += 1 / shotsPerSec;
    // Reload starts once the last shot's fire interval ends, matching the API's sustained-DPS figures.
    if (s.ammo <= 0) { s.reloadEnd = s.nextShot + st.reload; s.nextShot = s.reloadEnd; }
  }

  // Abilities and active items are used as soon as they're ready.
  const hit = c => (c.ability ? opts.abilityHit : 1);
  const fire = c => {
    for (const sv of c.instant) deal(atSpirit(sv, spirit) * hit(c), sv.type ?? 'spirit', c.source, sv.steal);
    // Each charge keeps its own damage over time; recasting a charge refreshes it.
    const slot = c.casts++ % c.maxCharges;
    c.dps.forEach((sv, i) => s.dots.set(`${c.name}:${i}:${slot}`, { dps: atSpirit(sv, spirit) * hit(c), until: t + c.duration, type: sv.type ?? 'spirit', source: c.source, steal: sv.steal }));
  };
  for (const c of s.casts) {
    if (c.resource) {
      while (c.stored >= c.resource.cost) { c.stored -= c.resource.cost; fire(c); }
      continue;
    }
    if (c.battery) {
      if (s.taken >= (c.battery / 100) * s.maxHp) { s.taken = 0; fire(c); }
      continue;
    }
    c.recharge = c.recharge.filter(at => (at <= t ? (c.charges++, false) : true));
    while (c.charges > 0 && t >= c.nextAllowed) {
      c.charges--;
      c.recharge.push(t + c.cooldown * (1 - st.cdr / 100));
      c.nextAllowed = t + (c.chargeGap || 0);
      fire(c);
    }
  }
  for (const d of s.dots.values()) if (t < d.until) deal(d.dps * SIM_STEP, d.type, d.source, d.steal);
  for (const sv of s.F.auras) deal(atSpirit(sv, spirit) * opts.abilityHit * SIM_STEP, sv.type ?? 'spirit', 'abilities', sv.steal);
  for (const b of s.F.bleeds) if (b.phase <= s.phase) deal((atSpirit(b.pct, spirit) / 100) * o.maxHp * SIM_STEP, 'spirit', 'items');
}

/* panel */

function renderMatchups(b) {
  const key = `${b.hero_build_id}:${b.version}`;
  if (MU.buildKey !== key) {
    MU.buildKey = key;
    MU.excluded.clear(); MU.excludedAbilities.clear(); MU.expanded.clear();
    applyIdealSettings();
  }
  const control = (label, id, min, max, step, value, fmt) => {
    const out = el('output', { id: `${id}Out`, text: fmt(value) });
    return el('div', { class: 'mu-control' },
      el('label', { for: id }, label, out),
      el('input', { type: 'range', id, min, max, step, value, oninput: e => {
        MU[id.slice(2).toLowerCase()] = Number(e.target.value);
        out.textContent = fmt(Number(e.target.value));
        scheduleMatchups();
      } }));
  };
  const check = (label, prop) => el('div', { class: 'mu-control' },
    el('label', { class: 'mu-check' },
      el('input', { type: 'checkbox', checked: MU[prop], onchange: e => { MU[prop] = e.target.checked; scheduleMatchups(); } }), label));
  const panel = el('section', { class: 'category mu-panel', id: 'matchups' },
    el('header', { class: 'cat-head' },
      el('h3', { class: 'cat-name', text: 'Duel Matchups' }),
      el('p', { class: 'cat-desc', text: 'Estimated 1v1 fights against each hero’s most-bought items at the same souls.' })),
    el('div', { class: 'mu-body' },
      el('p', { class: 'mu-hint' },
        `Starts at ${state.hero?.name ?? 'this hero'}’s ideal: max level with the full build, at ${idealRange(state.hero)} m (the farthest their gun does full damage), against Phantom+ meta builds. `,
        el('button', { class: 'pill', type: 'button', style: 'font-size:14px;padding:2px 12px', text: 'Ideal Settings',
          onclick: () => { applyIdealSettings(); $('#matchups').replaceWith(renderMatchups(state.currentBuild)); } })),
      el('div', { class: 'mu-controls' },
        control('Souls', 'muSouls', 1000, maxSouls(state.hero), 100, MU.souls, v => fmtNum(v)),
        control('Fight range', 'muRange', 3, 50, 1, MU.range, v => `${v} m`),
        control('Gun accuracy', 'muAccuracy', 10, 100, 1, MU.accuracy ?? 60, v => `${v}%`),
        control('Headshots (of hits)', 'muHeadshot', 0, 60, 1, MU.headshot, v => `${v}%`),
        control('Abilities land', 'muAbilityHit', 0, 100, 5, MU.abilityhit, v => `${v}%`),
        el('div', { class: 'mu-control' },
          el('label', { for: 'muMode' }, 'Damage model'),
          el('select', { id: 'muMode', onchange: e => { MU.mode = e.target.value; scheduleMatchups(); } },
            Object.entries(DAMAGE_MODES).map(([value, text]) => el('option', { value, text, selected: MU.mode === value })))),
        el('div', { class: 'mu-control' },
          el('label', { for: 'muRank' }, 'Opponent builds from'),
          el('select', { id: 'muRank', onchange: e => { MU.rank = e.target.value; loadMatchupData(); } },
            el('option', { value: 'all', selected: MU.rank === 'all', text: 'All ranks, since latest patch' }),
            el('option', { value: 'high', selected: MU.rank === 'high', text: 'Phantom+, since latest patch' }))),
        check('Include optional categories', 'optional'),
        check('Use ultimates', 'ultimates')),
      el('div', { id: 'muResults' }, el('p', { class: 'mu-loading', text: 'Matchups load when you scroll here…' }))));

  // Fetch the match data only when the panel is about to be seen.
  const io = 'IntersectionObserver' in window && new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting)) { io.disconnect(); loadMatchupData(); }
  }, { rootMargin: '600px' });
  if (io) setTimeout(() => io.observe(panel)); else loadMatchupData();
  return panel;
}

let matchupFrame = 0;
function scheduleMatchups() {
  clearTimeout(matchupFrame);
  matchupFrame = setTimeout(renderMatchupResults, 30);
}

async function loadMatchupData() {
  const box = $('#muResults');
  if (!box) return;
  box.replaceChildren(el('p', { class: 'mu-loading', text: 'Loading every hero’s meta build and ability order from match data…' }));
  try {
    const [heroes, meta] = await Promise.all([loadHeroList(), loadMeta(MU.rank)]);
    const orders = await loadAbilityOrders(MU.rank, heroes);
    MU.data = { heroes, meta, orders };
    if (MU.accuracy == null) {
      MU.accuracy = Math.round(meta.accuracy * 100);
      const slider = $('#muAccuracy');
      if (slider) { slider.value = MU.accuracy; $('#muAccuracyOut').textContent = `${MU.accuracy}%`; }
    }
    renderMatchupResults();
  } catch (err) {
    box.replaceChildren(el('p', { class: 'mu-loading' }, `Couldn’t load match data (${err.message}). `,
      el('button', { class: 'pill', type: 'button', onclick: loadMatchupData, text: 'Retry' })));
  }
}

function itemChip(item, { toggle = false, off = false } = {}) {
  const icon = assetUrl(item.image_webp, item.image);
  const fx = itemCombatEffects(item);
  const props = { class: `mu-chip slot-${item.item_slot_type}${off ? ' off' : ''}`, 'data-tip': `item:${item.id}` };
  const kids = [
    isLocal(icon) ? el('span', { class: 'glyph', style: `--icon:url("${icon}")` }) : icon && el('img', { src: icon, alt: '' }),
    item.name,
    fx.partial && el('span', { class: 'warn', title: 'Some effects of this item aren’t modeled', text: '◆' }),
  ];
  if (!toggle) return el('span', props, kids);
  return el('button', { ...props, type: 'button', title: off ? 'Excluded — click to include' : 'Click to leave out of your loadout',
    onclick: () => { MU.excluded.has(item.id) ? MU.excluded.delete(item.id) : MU.excluded.add(item.id); scheduleMatchups(); } }, kids);
}

function abilityChip(entry, spirit, { toggle = false } = {}) {
  const { ability, tier, model, off } = entry;
  const tierText = tier < 0 ? 'locked' : tier === 0 ? 'unlocked' : `T${tier}`;
  const kids = [
    gameImg([ability.image_webp, ability.image], { alt: '' }),
    ability.name,
    el('span', { class: 'sub', text: `${tierText}${model ? ` · ${abilitySummary(model, spirit)}` : ''}` }),
  ];
  const props = { class: `mu-chip ab${tier < 0 ? ' locked' : ''}${off ? ' off' : ''}`, 'data-tip': `ability:${ability.id}${tier > 0 ? `:${tier}` : ''}` };
  if (!toggle || tier < 0) return el('span', props, kids);
  return el('button', { ...props, type: 'button', title: off ? 'Excluded — click to include' : 'Click to leave this ability out',
    onclick: () => { MU.excludedAbilities.has(ability.id) ? MU.excludedAbilities.delete(ability.id) : MU.excludedAbilities.add(ability.id); scheduleMatchups(); } }, kids);
}

const muStat = (label, value, sub) => el('div', { class: 'mu-stat' }, el('b', { text: value }), el('span', { text: label }), sub && el('em', { text: sub }));

function fighterStatBoxes(F, opts, sample) {
  const st = fighterStats(F, 0, opts.range);
  const total = sample ? sample.gun + sample.items + sample.abilities : 0;
  return [
    muStat('Level', `${F.level}`),
    muStat('Health', fmtNum(Math.round(st.health)), F.barrier ? `+${fmtNum(F.barrier)} barrier` : null),
    muStat('Resist (bullet / spirit)', `${pct(combineResist(st.bulletResistSources))} / ${pct(combineResist(st.spiritResistSources))}`),
    muStat('Spirit power', `${Math.round(st.spirit)}`),
    muStat('Bullet damage', `${fmt1(st.bullet)}${st.pellets > 1 ? ` ×${st.pellets}` : ''}`),
    muStat('Shots / sec', fmt1(st.shotsPerSec)),
    muStat('Ammo / reload', `${st.clip} / ${fmt1(st.reload)}s`),
    sample && muStat(`Damage in ${SAMPLE_SECONDS}s`, fmtNum(Math.round(total)),
      `gun ${fmtNum(Math.round(sample.gun))} · items ${fmtNum(Math.round(sample.items))} · abilities ${fmtNum(Math.round(sample.abilities))}`),
  ];
}

function renderMatchupResults() {
  const box = $('#muResults');
  if (!box || !MU.data || !state.currentBuild) return;
  hideTip();
  const opts = {
    range: MU.range, accuracy: (MU.accuracy ?? 60) / 100, headshot: MU.headshot / 100, abilityHit: MU.abilityhit / 100,
    mode: MU.mode, ultimates: MU.ultimates,
  };
  const { heroes, orders } = MU.data;
  const mine = heroes.find(h => h.id === state.hero?.id) ?? state.hero;
  const order = buildOrder(state.currentBuild);
  const yourItems = loadoutAt(order, MU.souls, MU.excluded);
  const yourSequence = buildAbilitySequence(state.currentBuild);
  const you = buildFighter(mine, yourItems, MU.souls, yourSequence.length ? yourSequence : orders.get(mine.id) ?? defaultAbilitySequence(mine),
    { ...opts, excludedAbilities: MU.excludedAbilities });
  if (!you) { box.replaceChildren(el('p', { class: 'mu-loading', text: 'This hero’s weapon data isn’t available, so matchups can’t be estimated.' })); return; }
  const yourSpirit = fighterStats(you, 0, opts.range).spirit;
  const sample = simulate(you, { dummy: true }, opts, SAMPLE_SECONDS).a.bySource;

  const rows = heroes.map(hero => {
    const them = buildFighter(hero, loadoutAt(metaOrder(hero.id), MU.souls), MU.souls, orders.get(hero.id) ?? defaultAbilitySequence(hero), opts);
    if (!them) return null;
    const fight = simulate(you, them, opts);
    const yours = fight.you ?? SIM_MAX * 1.2, theirs = fight.them ?? SIM_MAX * 1.2;
    return { hero, them, fight, edge: theirs / Math.max(yours, 0.01) };
  }).filter(Boolean).sort((a, b) => b.edge - a.edge);

  const excludedShown = order.map(id => state.assets.byId.get(id)).filter(it => it && MU.excluded.has(it.id));
  const counted = yourItems.flatMap(it => itemCombatEffects(it).notes.length && opts.mode !== 'gun' ? [el('li', {}, el('b', { text: `${it.name}: ` }), itemCombatEffects(it).notes.join('; '))] : []);
  const abilityLines = you.abilities.filter(a => a.model).map(a => el('li', {}, el('b', { text: `${a.ability.name} (${a.tier === 0 ? 'unlocked' : `T${a.tier}`}): ` }), a.off ? 'left out' : abilitySummary(a.model, yourSpirit)));

  box.replaceChildren(
    el('h4', { class: 'mu-sub', text: `Your loadout at ${fmtNum(MU.souls)} souls` }),
    el('p', { class: 'mu-hint', text: 'Items from this build, bought in order until the souls run out, and abilities from its ability order. Click an item or ability to leave it out.' }),
    el('div', { class: 'mu-chips' },
      yourItems.length ? yourItems.map(it => itemChip(it, { toggle: true })) : el('span', { class: 'mu-hint', text: 'No items affordable yet.' }),
      excludedShown.map(it => itemChip(it, { toggle: true, off: true }))),
    opts.mode === 'full' && el('div', { class: 'mu-chips', style: 'margin-top:6px' }, you.abilities.map(a => abilityChip(a, yourSpirit, { toggle: true }))),
    el('div', { class: 'mu-stats' }, fighterStatBoxes(you, opts, sample)),
    opts.mode !== 'gun' && el('details', { class: 'mu-details' },
      el('summary', { text: 'What’s counted for your build' }),
      el('ul', {}, counted, abilityLines,
        you.partial.length > 0 && el('li', {}, el('b', { text: 'Partly modeled: ' }), `${you.partial.map(i => i.name).join(', ')} have effects that aren’t counted (marked ◆).`))),
    el('h4', { class: 'mu-sub', text: 'Duels against each hero’s meta build' }),
    el('p', { class: 'mu-hint', text: 'Both heroes fight at once at the same souls, range and aim. Click a hero to see their items and abilities.' }),
    el('div', { class: 'mu-table-wrap' }, el('table', { class: 'mu-table' },
      el('thead', {}, el('tr', {},
        el('th', { text: 'Hero' }), el('th', { class: 'n', text: 'Their HP' }), el('th', { class: 'n', text: 'Resist B / S' }),
        el('th', { class: 'n', text: 'You kill in' }), el('th', { class: 'n', text: 'They kill in' }), el('th', { text: 'Duel' }))),
      el('tbody', {}, rows.flatMap(r => matchupRows(r, opts))))),
    el('p', { class: 'mu-hint', text: `Estimate only. Buffs that need a trigger count as active during fights, or are averaged over their cooldown. Build-up items trigger after about ${BUILDUP_SECONDS}s of hits. Abilities are used as soon as they’re ready and hit at the rate you set. Movement, stuns, silences, healing other than lifesteal, and ability mechanics like stacks or execute bonuses aren’t modeled. Opponent builds use items at least ${pct(META_MIN_PICK)} of that hero’s players buy, in average purchase order, with their most common ability order.` }));
}

function matchupRows({ hero, them, fight, edge }, opts) {
  const open = MU.expanded.has(hero.id);
  const win = edge >= 1;
  const width = Math.min(1, Math.abs(Math.log2(edge)) / 1.5) * 50;
  const youT = fight.you ?? SIM_MAX * 1.2, themT = fight.them ?? SIM_MAX * 1.2;
  const diff = Math.abs(themT - youT);
  const st = fighterStats(them, 0, opts.range);
  const toggle = () => { open ? MU.expanded.delete(hero.id) : MU.expanded.add(hero.id); scheduleMatchups(); };
  const label = fight.you == null && fight.them == null ? `Nobody wins in ${SIM_MAX}s`
    : fight.you == null || fight.them == null ? `${win ? 'You' : 'They'} win`
    : diff < 0.05 ? 'Even' : `${win ? 'You' : 'They'} win by ${fmt1(diff)}s`;
  const row = el('tr', { class: `mu-row${hero.id === state.hero?.id ? ' self' : ''}`, tabindex: 0, 'aria-expanded': String(open), onclick: toggle,
    onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } } },
    el('td', {}, el('div', { class: 'mu-hero' },
      el('span', { class: 'caret', text: open ? '▾' : '▸' }),
      gameImg([hero.images?.icon_image_small_webp, hero.images?.icon_image_small], { alt: '' }), hero.name)),
    el('td', { class: 'n', text: fmtNum(Math.round(st.health + them.barrier)) }),
    el('td', { class: 'n', text: `${pct(combineResist(st.bulletResistSources))} / ${pct(combineResist(st.spiritResistSources))}` }),
    el('td', { class: 'n', text: fmtTime(fight.you) }),
    el('td', { class: 'n', text: fmtTime(fight.them) }),
    el('td', {}, el('div', { class: 'edge' },
      el('span', { class: 'edge-bar' }, el('span', { class: win ? 'edge-win' : 'edge-loss', style: win ? `left:50%;width:${width}%` : `right:50%;width:${width}%` })),
      el('span', { class: `edge-label ${win ? 'win' : 'loss'}`, text: label }))));
  if (!open) return [row];
  const theirSpirit = st.spirit;
  const sample = simulate(them, { dummy: true }, opts, SAMPLE_SECONDS).a.bySource;
  return [row, el('tr', { class: 'mu-detail' }, el('td', { colspan: 6 },
    el('div', { class: 'mu-chips' }, them.held.length ? them.held.map(it => itemChip(it)) : el('span', { class: 'mu-hint', text: 'No meta items affordable at these souls.' })),
    opts.mode === 'full' && el('div', { class: 'mu-chips', style: 'margin-top:6px' }, them.abilities.map(a => abilityChip(a, theirSpirit))),
    el('div', { class: 'mu-stats' }, fighterStatBoxes(them, opts, sample))))];
}

/* ---------- tooltips ---------- */

const noteBlock = note => el('div', { class: 'tt-note' }, el('b', { text: 'Author note' }), note);

function itemTip(id, note, imbueId) {
  const item = state.assets.byId.get(id);
  if (!item) {
    return el('div', { class: 'slot-unknown' },
      el('div', { class: 'tt-head' }, el('div', { class: 'tt-title' }, el('strong', { text: 'Unknown item' }), el('span', { class: 'tt-sub', text: `ID ${id}` }))),
      note && noteBlock(note),
      el('div', { class: 'tt-sec' }, el('p', { class: 'tt-desc', text: 'This item isn’t in the current item list. It was probably removed or replaced in a patch.' })));
  }
  const imbue = imbueId && state.assets.byId.get(imbueId);
  const sections = (item.tooltip_sections ?? []).map(sec => renderTipSection(sec, item.properties)).filter(Boolean);
  if (!sections.length && item.description?.desc) sections.push(el('div', { class: 'tt-sec' }, el('p', { class: 'tt-desc' }, richText(item.description.desc))));
  return el('div', { class: `slot-${item.item_slot_type}` },
    el('div', { class: 'tt-head' },
      el('div', { class: 'tt-title' },
        el('strong', { text: item.name }),
        el('span', { class: 'tt-sub', text: [cap(item.item_slot_type), `Tier ${item.item_tier}`, item.is_active_item && 'Active'].filter(Boolean).join(' · ') })),
      item.cost != null && el('span', { class: 'tt-cost' }, soulIcon(), fmtNum(item.cost))),
    note && noteBlock(note),
    imbue && el('div', { class: 'tt-imbue' }, gameImg([imbue.image_webp, imbue.image], { alt: '' }), `Imbued on ${imbue.name}`),
    sections);
}

function renderTipSection(sec, props) {
  const parts = [];
  for (const attr of sec.section_attributes ?? []) {
    if (attr.loc_string) parts.push(el('p', { class: 'tt-desc' }, richText(attr.loc_string)));
    const big = [...(attr.elevated_properties ?? []), ...(attr.important_properties ?? [])].map(k => fmtProp(props?.[k])).filter(Boolean);
    const small = (attr.properties ?? []).map(k => fmtProp(props?.[k])).filter(Boolean);
    if (big.length) parts.push(el('div', { class: 'tt-stats big' }, big.map(statRow)));
    if (small.length) parts.push(el('div', { class: 'tt-stats' }, small.map(statRow)));
  }
  if (!parts.length) return null;
  const type = sec.section_type ?? 'innate';
  return el('div', { class: 'tt-sec' }, type !== 'innate' && el('div', { class: 'tt-sec-label', text: type }), parts);
}

const statRow = s => el('div', { class: 'stat' }, el('span', { class: 'stat-v', text: s.value }), el('span', { class: 'stat-l', text: s.label }));

function abilityTip(id, tier, note) {
  const ability = state.assets.byId.get(id);
  if (!ability) return null;
  const d = ability.description ?? {};
  const sub = tier === 0 ? 'Unlock' : tier ? `Tier ${tier} upgrade` : cap(ability.ability_type === 'ultimate' ? 'ultimate' : 'ability');
  return el('div', { class: 'tt-ability' },
    el('div', { class: 'tt-head' },
      gameImg([ability.image_webp, ability.image], { class: 'tt-icon', alt: '' }),
      el('div', { class: 'tt-title' }, el('strong', { text: ability.name }), el('span', { class: 'tt-sub', text: sub }))),
    note && noteBlock(note),
    d.desc && el('p', { class: 'tt-desc' }, richText(d.desc)),
    el('div', { class: 'tt-tiers' }, [1, 2, 3].map(n => {
      const text = d[`t${n}_desc`] ? richText(d[`t${n}_desc`]) : upgradeText(ability, n);
      return text && el('div', { class: `tt-tier${tier === n ? ' on' : ''}` },
        el('span', { class: 'tier-badge', text: `T${n} · ${AP_COST[n]} AP` }),
        el('span', {}, text));
    })));
}

// Some abilities have no written tier text; build it from the stat changes like the game does.
function upgradeText(ability, n) {
  const changes = ability.upgrades?.[n - 1]?.property_upgrades ?? [];
  const lines = changes.map(u => {
    const prop = ability.properties?.[u.name];
    const label = prop?.label || u.name.replace(/([a-z])([A-Z])/g, '$1 $2');
    const num = parseFloat(u.bonus);
    if (Number.isNaN(num)) return null;
    const sign = num > 0 ? '+' : '';
    if (u.upgrade_type === 'EAddToScale') return `${sign}${num} Spirit Power scaling on ${label}`;
    const unit = /[a-z%]$/i.test(String(u.bonus)) ? '' : (prop?.postfix || '').replace(/\{[^}]*\}/g, '');
    return `${sign}${u.bonus}${unit} ${label}`;
  }).filter(Boolean);
  if (!lines.length) return null;
  return el('span', {}, lines.flatMap((line, i) => [i > 0 && el('br'), el('span', { class: 'hl', text: line.split(' ')[0] }), ` ${line.split(' ').slice(1).join(' ')}`]));
}

const tip = $('#tooltip');
let tipAnchor = null;
let lastPointer = 'mouse';

function showTip(anchor, fromTouch = false) {
  const [kind, id, tier] = anchor.dataset.tip.split(':');
  const note = anchor.dataset.note || null;
  const content = kind === 'item' ? itemTip(Number(id), note, Number(anchor.dataset.imbue) || null)
    : kind === 'hero' ? heroTip(Number(id))
    : kind === 'tier' ? tierTip(id)
    : abilityTip(Number(id), tier == null ? null : Number(tier), note);
  if (!content) return;
  tip.replaceChildren(content);
  tip.classList.toggle('touch', fromTouch);
  tip.hidden = false;
  tipAnchor = anchor;
  positionTip(anchor);
}

function hideTip() {
  tip.hidden = true;
  tipAnchor = null;
}

function positionTip(anchor) {
  const r = anchor.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  const gap = 10, pad = 8, vw = innerWidth, vh = innerHeight;
  let left, top;
  if (r.right + gap + t.width <= vw - pad) { left = r.right + gap; top = r.top; }
  else if (r.left - gap - t.width >= pad) { left = r.left - gap - t.width; top = r.top; }
  else {
    left = Math.min(Math.max(pad, r.left + r.width / 2 - t.width / 2), vw - t.width - pad);
    top = r.bottom + gap;
    if (top + t.height > vh - pad && r.top - gap - t.height >= pad) top = r.top - gap - t.height;
  }
  top = Math.min(Math.max(pad, top), Math.max(pad, vh - t.height - pad));
  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
}

document.addEventListener('pointerdown', e => { lastPointer = e.pointerType; }, true);
document.addEventListener('mouseover', e => {
  if (lastPointer === 'touch') return;
  const anchor = e.target.closest('[data-tip]');
  if (anchor && anchor !== tipAnchor) showTip(anchor);
});
document.addEventListener('mouseout', e => {
  if (lastPointer === 'touch' || !tipAnchor) return;
  if (!tipAnchor.contains(e.relatedTarget)) hideTip();
});
document.addEventListener('focusin', e => {
  const anchor = e.target.closest('[data-tip]');
  if (anchor && lastPointer !== 'touch') showTip(anchor);
});
document.addEventListener('focusout', e => { if (e.target === tipAnchor && lastPointer !== 'touch') hideTip(); });
document.addEventListener('click', e => {
  if (lastPointer !== 'touch') return;
  if (tip.contains(e.target)) return;
  const anchor = e.target.closest('[data-tip]');
  if (anchor && anchor !== tipAnchor) showTip(anchor, true);
  else hideTip();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', () => { if (!tip.classList.contains('touch')) hideTip(); }, { passive: true });
addEventListener('resize', hideTip);

/* ---------- actions & routing ---------- */

// Copies the build ID, ready to paste into the in-game build browser.
async function copyBuild(e, id) {
  const btn = e.currentTarget;
  const ok = await copyText(String(id));
  btn.textContent = ok ? 'Copied!' : `ID ${id}`;
  setTimeout(() => { btn.textContent = 'Copy Build'; }, ok ? 1600 : 4000);
}

// The Clipboard API is unavailable over plain http (e.g. opening the site from another
// device on the network), so fall back to copying a selected hidden text box.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const box = el('textarea', { readonly: '', style: 'position:fixed;top:0;left:0;opacity:0' });
    box.value = text;
    document.body.append(box);
    box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    box.remove();
    return ok;
  }
}

function go(raw) {
  const id = String(raw).match(/\d+/)?.[0];
  if (!id) {
    showStatus('error', 'That doesn’t look like a build ID', 'Build IDs are numbers, like 439842.');
    $('#build').hidden = true;
    return;
  }
  const url = new URL(location.href);
  url.search = `?id=${id}`;
  history.pushState(null, '', url);
  scrollTo(0, 0);
  route();
}

function route() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const top = params.get('top');
  const page = params.get('view');
  const view = id && /^\d+$/.test(id) ? 'build' : top && /^\d+$/.test(top) ? 'top' : page === 'roster' || page === 'counter' ? page : 'home';
  $('#navHome').toggleAttribute('aria-current', view === 'home');
  $('#navRoster').toggleAttribute('aria-current', view === 'roster');
  $('#navCounter').toggleAttribute('aria-current', view === 'counter');
  if (view !== 'counter') $('#counter').hidden = true;
  if (view === 'counter') {
    showCounter();
  } else if (view === 'build') {
    $('#buildId').value = id;
    loadBuild(id);
  } else if (view === 'top') {
    loadTopBuild(Number(top));
  } else if (view === 'roster') {
    showRoster();
  } else {
    showHome();
  }
}

// Page links navigate in place instead of reloading.
for (const link of [$('#navHome'), $('#navRoster'), $('#navCounter')]) {
  link.addEventListener('click', e => {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    e.preventDefault();
    history.pushState(null, '', link.href);
    scrollTo(0, 0);
    route();
  });
}

/* ---------- instant-load snapshot ---------- */

// Everything the first screens show (tier lists for both ranks, heroes, item icons, meta builds, the
// roster's heroes) is computed ahead of time: the deploy workflow opens this page in a headless
// browser, calls buildSnapshot(), and publishes the result as data/snapshot.json. A visit then draws
// straight from that file, with no API calls, match download or model fitting, and only fetches the
// heavy details (full item data for tooltips and build pages) in the background.
const SNAPSHOT_VERSION = 1;
const SNAPSHOT_MAX_AGE_HOURS = 6; // older than this (updates paused?) and the page computes live instead

const slimHero = h => ({ id: h.id, name: h.name, class_name: h.class_name, images: h.images, colors: h.colors,
  player_selectable: h.player_selectable, prerelease_only: h.prerelease_only, in_development: h.in_development, disabled: h.disabled });
const slimItem = i => ({ id: i.id, class_name: i.class_name, name: i.name, type: i.type, shopable: i.shopable, image: i.image, image_webp: i.image_webp,
  shop_image: i.shop_image, shop_image_webp: i.shop_image_webp, item_slot_type: i.item_slot_type, item_tier: i.item_tier, cost: i.cost, is_active_item: i.is_active_item });

// Only the commonly bought items are kept: that is all the hero cards and loadouts read.
const packMeta = m => ({ accuracy: m.accuracy, totalMatches: m.totalMatches,
  byHero: [...m.byHero].map(([id, h]) => [id, { matches: h.matches, wins: h.wins,
    items: h.items.filter(r => r.matches / Math.max(1, h.matches) >= Math.min(META_MIN_PICK, CORE_MIN_PICK))
      .map(r => ({ item_id: r.item_id, matches: r.matches, wins: r.wins, avg_buy_time_s: r.avg_buy_time_s })) }]) });
const unpackMeta = m => ({ ...m, byHero: new Map(m.byHero) });

// Tier results reference the TIERS table by key in the file and by object in memory.
function packTiers(t) {
  if (t.mode !== 'model') return null;
  return {
    mode: t.mode, rank: t.rank, coef: t.coef, tau: t.tau, fights: t.fights,
    community: t.community && { posts: t.community.posts, comments: t.community.comments, source: t.community.source, updated: t.community.updated },
    model: { matches: t.model.matches, best: t.model.best, test: t.model.test },
    stats: [...t.stats].map(([id, s]) => [id, {
      ...s, tier: s.tier.key, moved: s.moved && { ...s.moved, from: s.moved.from.key },
      duel: s.duel && { wins: s.duel.wins, losses: s.duel.losses, draws: s.duel.draws, best: s.duel.best, worst: s.duel.worst, simplified: s.duel.simplified },
    }]),
  };
}
function unpackTiers(p) {
  const tier = key => TIERS.find(t => t.key === key);
  return { ...p, stats: new Map(p.stats.map(([id, s]) => [id, { ...s, tier: tier(s.tier), moved: s.moved && { ...s.moved, from: tier(s.moved.from) } }])) };
}

// Called by tools/snapshot.mjs on a page opened with ?snapshot=1 (which computes everything fresh).
window.buildSnapshot = async () => {
  const [heroes, assets, patches, metaAll, metaHigh, tiersAll, tiersHigh, topBuilds, roster, counters, manifest, steam] = await Promise.all([
    loadHeroList(), loadAssets(), loadPatches(), loadMeta('all'), loadMeta('high'), loadTiers('all'), loadTiers('high'), loadTopBuilds(), loadRosterHeroes(), loadCounterData(),
    fetch(MANIFEST_URL, { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)).catch(() => null),
    getJSON(`${API}/assets/steam-info`).catch(() => null),
  ]);
  return JSON.stringify({
    version: SNAPSHOT_VERSION, built: Math.floor(Date.now() / 1000),
    heroes: heroes.map(slimHero),
    items: [...assets.byId.values()].filter(i => i.type === 'upgrade').map(slimItem),
    patches, topBuilds, counters, manifest, steam: steam && { client_version: steam.client_version },
    meta: { all: packMeta(metaAll), high: packMeta(metaHigh) },
    tiers: { all: packTiers(tiersAll), high: packTiers(tiersHigh) },
    roster: roster.map(e => ({ hero: slimHero(e.hero), locked: e.locked, isNew: e.isNew })),
  });
};

// Fills the loaders' cache from the snapshot so the first screens need nothing else.
async function seedSnapshot(request = window.snapshotRequest) {
  const snap = await request;
  if (!snap || snap.version !== SNAPSHOT_VERSION || Date.now() / 1000 - snap.built > SNAPSHOT_MAX_AGE_HOURS * 3600) return false;
  const ready = value => Promise.resolve(value);
  memo.set('heroesFast', ready(snap.heroes));
  memo.set('assetsFast', ready(indexItems(snap.items, false)));
  memo.set('patches', ready(snap.patches));
  memo.set('rosterHeroes', ready(snap.roster));
  if (snap.topBuilds) memo.set('topBuilds', ready(snap.topBuilds));
  if (snap.counters) memo.set('counterData', ready(snap.counters));
  for (const rank of ['all', 'high']) {
    if (snap.meta?.[rank]) memo.set(`metaFast:${rank}`, ready(unpackMeta(snap.meta[rank])));
    if (snap.tiers?.[rank]) memo.set(`tiers:${rank}`, ready(unpackTiers(snap.tiers[rank])));
  }
  if (snap.manifest) memo.set('manifest', ready(applyManifest(snap.manifest, snap.steam)));
  return true;
}

// A tab left open for a while reloads its data when it comes back into view, so a new patch, new
// builds or refreshed game art show up without a manual refresh.
const DATA_MAX_AGE_MS = 30 * 60 * 1000;
let dataLoadedAt = Date.now();
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || Date.now() - dataLoadedAt < DATA_MAX_AGE_MS) return;
  dataLoadedAt = Date.now();
  memo.clear();
  itemFxCache.clear();
  abilityCache.clear();
  HOME.builds.clear();
  Object.assign(HOME, { tiers: null, tierFor: null, meta: null, window: null });
  MU.data = null;
  if (window.snapshotRequest) await seedSnapshot(fetch('data/snapshot.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)).catch(() => null));
  route();
});

$('#lookup').addEventListener('submit', e => {
  e.preventDefault();
  go($('#buildId').value);
});
addEventListener('popstate', route);
seedSnapshot().catch(() => false).then(() => {
  loadManifest();
  route();
});
</script>
</body>
</html>
