<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadlock Build Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1 14 8 8 15 2 8z' fill='%2370F8C1'/%3E%3C/svg%3E">
<script>
  // Start downloading the precomputed snapshot (tier list, heroes, meta builds) right away, so the
  // page can draw from it the moment the main script runs. Skipped when building the snapshot itself.
  window.snapshotRequest = new URLSearchParams(location.search).has('snapshot') ? null
    : fetch('data/snapshot.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)).catch(() => null);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
  /* Fonts and art come from the local game install via tools/extract_assets.py. */
  @font-face { font-family: "Radiance"; src: url("assets/game/fonts/radiance-regular.otf"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Radiance"; src: url("assets/game/fonts/radiance-regularitalic.otf"); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: "Radiance"; src: url("assets/game/fonts/radiance-semibold.otf"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Radiance"; src: url("assets/game/fonts/radiance-bold.otf"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Radiance"; src: url("assets/game/fonts/radiance-bolditalic.otf"); font-weight: 700; font-style: italic; font-display: swap; }
  @font-face { font-family: "VALVE Oracle"; src: url("assets/game/fonts/valveoracle-medium.ttf"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "VALVE Oracle"; src: url("assets/game/fonts/valveoracle-semibold.ttf"); font-weight: 600 700; font-display: swap; }
  @font-face { font-family: "Retail Text"; src: url("assets/game/fonts/retailtextdemo-regular.otf"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Retail Text"; src: url("assets/game/fonts/retailtextdemo-bold.otf"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "VALVE Pulp"; src: url("assets/game/fonts/valvepulp-bold.ttf"); font-weight: 400 700; font-display: swap; }

  :root {
    color-scheme: dark;
    /* Named colors from the game's own stylesheets. */
    --off-black: #10130D;
    --off-white: #FFEFD7;
    --shard: #99FFD6;
    --mods-gold: #FFDB79;
    --builds: #4D7EC8;
    --builds-dark: #365B92;
    --builds-light: #85B5FF;

    --bg: var(--off-black);
    --panel: #181c15;
    --line: #2c3227;
    --line2: #3d4537;
    --text: var(--off-white);
    --text2: #dcd0bb;
    --muted: #a59f8e;
    --faint: #78766a;
    --hero: #c9b48a;

    /* The game's own fonts when extracted locally; Jost (an open font Deadlock also ships) online. */
    --sans: "Radiance", "Jost", "Segoe UI", system-ui, sans-serif;
    --oracle: "VALVE Oracle", "Jost", "Radiance", "Segoe UI", sans-serif;
    --mono: "Retail Text", "Radiance", ui-monospace, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; }
  button, input, select { font: inherit; color: inherit; }

  /* The hero's painted backdrop sits behind the shop, like the game world behind the in-game shop. */
  .backdrop { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; opacity: .2; filter: saturate(.8); }
  .backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, #10130Dcc, #10130D33 40%, #10130D99); }

  /* slot palettes: courage = weapon, fortitude = vitality, spirit = spirit */
  .slot-weapon   { --slot: #EC9719; --slot-dark: #7F540E; --slot-darker: #302306; --tt-head: url("assets/game/ui/shop/catalog/catalog_tooltip_header_weapon.webp"); }
  .slot-vitality { --slot: #7BBA1D; --slot-dark: #4C7113; --slot-darker: #1F3400; --tt-head: url("assets/game/ui/shop/catalog/catalog_tooltip_header_vitality.webp"); }
  .slot-spirit   { --slot: #CE90FF; --slot-dark: #613484; --slot-darker: #362147; --tt-head: url("assets/game/ui/shop/catalog/catalog_tooltip_header_spirit.webp"); }
  .slot-unknown  { --slot: #8a8f86; --slot-dark: #43473f; --slot-darker: #23261f; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px max(16px, calc((100vw - 1360px) / 2));
    background: #10130De6;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-family: var(--oracle); font-weight: 600; font-size: 24px; text-decoration: none; color: var(--text); }
  .brand span { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .lookup { display: flex; gap: 8px; margin-left: auto; flex: 0 1 380px; min-width: 0; }
  .lookup input {
    flex: 1; min-width: 0; padding: 8px 12px;
    background: #1a1e16; border: 1px solid var(--line2); border-radius: 3px;
    font-family: var(--mono); letter-spacing: .04em;
  }
  .lookup input:focus { outline: 2px solid var(--builds-light); outline-offset: 1px; }
  @media (max-width: 560px) { .lookup { flex-basis: 100%; } }

  .pill {
    padding: 5px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    background: #24454b; color: #f4ecdc; border: 2px solid #9ad0d866;
    font-family: var(--oracle); font-weight: 600; font-size: 18px; line-height: 1.2;
    box-shadow: inset 0 2px 0 #ffffff14, 0 2px 4px #0006;
  }
  .pill:hover { background: #2d5761; }
  .pill:focus-visible, .info-btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--off-white); outline-offset: 2px; }
  select.pill {
    appearance: none; padding-right: 34px; max-width: 100%;
    background-image: linear-gradient(45deg, transparent 50%, #f4ecdc 50%), linear-gradient(-45deg, transparent 50%, #f4ecdc 50%);
    background-position: right 17px center, right 12px center; background-size: 5px 5px; background-repeat: no-repeat;
  }
  select.pill option { background: #24454b; color: #f4ecdc; font-family: var(--sans); font-size: 15px; }

  main { max-width: 1360px; margin: 0 auto; padding: 24px 16px 48px; }

  /* ---------- status / empty ---------- */
  .status { padding: 48px 16px; text-align: center; color: var(--muted); }
  .status h2 { font-family: var(--oracle); font-weight: 600; font-size: 28px; color: var(--text); margin: 0 0 6px; }
  .status p { margin: 0 auto 18px; max-width: 52ch; }
  .status.error h2 { color: #f0a08a; }
  .spinner { width: 32px; height: 32px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid var(--line2); border-top-color: var(--builds-light); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- shop frame ---------- */
  .shop { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: start; }
  .shop-tabs { display: flex; flex-direction: column; gap: 6px; margin-right: -4px; position: relative; z-index: 1; }
  .tab { width: 64px; padding: 0; border: 0; background: none; cursor: pointer; filter: brightness(.78) saturate(.85); transition: filter .12s, transform .12s; }
  .tab:hover { filter: none; }
  .tab[aria-pressed="true"] { filter: none; transform: translateX(3px); }
  .tab img { width: 100%; }
  .tab .tab-small { display: none; }
  .tab-fallback { display: grid; place-items: center; height: 62px; border-radius: 6px 0 0 6px; font-family: var(--oracle); font-weight: 600; color: var(--off-black); background: var(--slot, #5fb0c0); }
  .shop-tabs .tab-all .tab-fallback { height: 182px; }

  .shop-panel {
    position: relative; min-width: 0;
    background: #a0927a url("assets/game/ui/shop/catalog/catalog_shop_generic_bg2.webp") center top / cover;
    border-radius: 4px; box-shadow: 0 24px 60px #000c;
  }
  .build-header {
    display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 8px 18px 14px;
    background: #5fb0c0 url("assets/game/ui/shop/catalog/catalog_shop_builds_header_bg.webp") left top / 100% 100% no-repeat;
    border-radius: 4px 4px 0 0;
  }
  .local-assets .build-header { background-color: transparent; }
  .hdr-hero { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; box-shadow: 0 0 0 2px #10130D80; }
  .build-title { flex: 1; min-width: 0; margin: 0; font-family: var(--oracle); font-weight: 600; font-size: 31px; line-height: 1.1; color: var(--off-black); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hdr-btns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .info-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer; background: var(--off-black); color: #fff; font-family: Georgia, serif; font-weight: 700; font-style: italic; font-size: 19px; line-height: 34px; padding: 0; }
  .info-btn[aria-expanded="true"] { background: #24454b; box-shadow: 0 0 0 2px #9ad0d8; }

  .build-info { display: flex; gap: 18px; padding: 14px 18px; background: #10130De0; border-bottom: 2px solid #00000060; }
  .build-info[hidden] { display: none; }
  .info-portrait { width: 88px; flex: none; align-self: flex-start; border-radius: 3px; box-shadow: 0 0 0 1px var(--line2); }
  .info-main { min-width: 0; }
  .hero-logo { height: 30px; aspect-ratio: 2138 / 453; background: var(--hero); -webkit-mask: var(--logo) left center / contain no-repeat; mask: var(--logo) left center / contain no-repeat; }
  .hero-text { font-family: var(--oracle); font-weight: 600; font-size: 22px; color: var(--hero); }
  .info-desc { margin: 6px 0 0; color: var(--text2); max-width: 75ch; white-space: pre-line; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin-top: 10px; color: var(--muted); font-size: 14px; }
  .meta strong { color: var(--text); font-weight: 600; }
  .num { font-family: var(--mono); font-weight: 700; }
  .author { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; }
  a.author:hover strong { text-decoration: underline; }
  .author img { width: 22px; height: 22px; border-radius: 3px; }
  .fav { display: inline-flex; align-items: center; gap: 6px; }
  .fav-icon { width: 15px; height: 14px; background: var(--mods-gold); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .local-assets .fav-icon { clip-path: none; -webkit-mask: url("assets/game/ui/shop/builds/icon_fave_active.svg") center / contain no-repeat; mask: url("assets/game/ui/shop/builds/icon_fave_active.svg") center / contain no-repeat; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 5px; font-size: 13px; color: var(--text2); background: #000a; border: 1px solid var(--line2); border-radius: 999px; }
  .tag img { width: 18px; height: 18px; }

  /* how-to-play summary, shown above meta builds' names */
  .play-summary { padding: 12px 18px 14px; background: #10130Df2; border-left: 4px solid var(--hero); border-radius: 4px 4px 0 0; }
  .play-summary + .build-header { border-radius: 0; }
  .ps-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ps-title { margin: 0; font-family: var(--oracle); font-weight: 600; font-size: 21px; line-height: 1.1; color: var(--mods-gold); }
  .ps-badge { padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--hero) 30%, #000); border: 1px solid var(--hero); color: var(--off-white); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: help; }
  .ps-rows { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; margin: 0; }
  .ps-rows dt { padding-top: 4px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .ps-rows dd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0; color: var(--text); font-size: 15px; line-height: 1.35; }
  .ps-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 3px; background: #000b; border: 1px solid var(--line2); border-left: 3px solid var(--slot, var(--hero)); border-radius: 3px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: help; }
  .ps-chip img { flex: none; width: 22px; height: 22px; object-fit: contain; }
  .ps-chip .glyph { flex: none; width: 20px; height: 20px; background: var(--slot, var(--hero)); -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  .ps-chip em { font-style: normal; font-weight: 600; color: var(--muted); }
  .ps-chip:focus-visible { outline: 2px solid var(--mods-gold); outline-offset: 1px; }
  .ps-arrow { color: var(--muted); }
  .ps-split { display: flex; width: 150px; height: 8px; overflow: hidden; border-radius: 4px; background: #000; }
  .ps-split span { background: var(--slot); }
  .ps-split-key { display: flex; gap: 10px; font-size: 13px; }
  .ps-split-key b { color: var(--slot); font-weight: 700; }
  @media (max-width: 560px) {
    .play-summary { padding: 10px 12px 12px; }
    .ps-rows { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    .ps-rows dt { padding-top: 6px; }
    .ps-chip { white-space: normal; }
  }

  /* ---------- categories (CitadelShopModsBuildCategory) ---------- */
  .shop-body { padding: 14px 16px 22px; }
  .categories { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .category { width: min(100%, var(--w)); border: 2px solid #00000060; box-shadow: inset 0 0 0 1px #ffffff1c; }
  .category.optional { background: #365B9270; }
  .cat-head { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 10px; padding: 6px 12px; min-height: 40px; background: #10130D80; }
  .cat-name { min-width: 0; margin: 0; font-family: var(--oracle); font-weight: 600; font-size: 19px; line-height: 1.2; color: var(--off-white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .optional-label { margin-left: -4px; padding: 0 5px; border-radius: 2px; background: #00000050; color: #85B5FFdd; font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .cat-desc { flex: 1 1 200px; margin: 0; font-weight: 600; font-size: 15px; line-height: 1.3; color: #FFEFD799; overflow-wrap: anywhere; white-space: pre-line; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }

  /* ---------- item cards (CitadelShopMod) ---------- */
  .card {
    position: relative; flex: none; width: 84px; height: 122px; padding: 0; border: 0; border-radius: 3px;
    display: flex; flex-direction: column; cursor: pointer; text-align: center; color: var(--off-black);
    background-color: var(--card-fallback, #d8c8a8); background-image: var(--card, none); background-size: 100% 100%;
    box-shadow: 0 2px 5px #0008, 0 0 0 1px #00000055;
    transition: transform .12s ease, filter .12s ease, opacity .15s ease;
  }
  .local-assets .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: url("assets/game/ui/shop/catalog/cards/shopitem_paperwear01.webp") center / 100% 100% no-repeat; opacity: .5; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); filter: brightness(1.1); }
  .card:focus-visible { outline: 2px solid var(--builds-light); outline-offset: 2px; }
  .card-art { position: relative; display: block; width: 84px; height: 84px; flex: none; }
  .card-art > img { width: 100%; height: 100%; object-fit: cover; }
  .local-assets .card-art > img.painting { mask: url("assets/game/ui/shop/catalog/cards/icon_mask01.webp") center / 100% 100% no-repeat luminance; }
  .card-art .glyph { position: absolute; inset: 18%; background: var(--slot-darker); -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  .card-art .unknown { display: grid; place-items: center; height: 100%; font-family: var(--oracle); font-weight: 600; font-size: 36px; color: #10130D88; }
  .card-name { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 3px 3px; overflow: hidden; }
  .card-name > span { display: block; max-width: 80px; font-family: var(--oracle); font-weight: 600; font-size: 15px; line-height: .92; }
  .tier-3.slot-weapon .card-name { color: #000; text-shadow: 0 0 12px #aa8470; }
  .tier-4.slot-weapon .card-name { color: #e4c5a1; }
  .tier-4.slot-vitality .card-name { color: #c2e7cd; }
  .tier-4.slot-spirit .card-name { color: #e3d4f2; }
  /* fallback card colors when game art isn't extracted */
  .slot-weapon.tier-1 { --card-fallback: #e8cb98; } .slot-weapon.tier-2 { --card-fallback: #c69f68; } .slot-weapon.tier-3 { --card-fallback: #a8743f; } .slot-weapon.tier-4 { --card-fallback: #3b322b; }
  .slot-vitality.tier-1 { --card-fallback: #d6de98; } .slot-vitality.tier-2 { --card-fallback: #a7b27a; } .slot-vitality.tier-3 { --card-fallback: #8b9767; } .slot-vitality.tier-4 { --card-fallback: #34361f; }
  .slot-spirit.tier-1 { --card-fallback: #e2d0ee; } .slot-spirit.tier-2 { --card-fallback: #a29ac3; } .slot-spirit.tier-3 { --card-fallback: #8279ae; } .slot-spirit.tier-4 { --card-fallback: #433c3e; }

  .tier-wrap { position: absolute; top: 0; right: 0; width: 24px; height: 24px; filter: drop-shadow(-3px 0 5px #000000cc); pointer-events: none; }
  .tier-cap { position: absolute; inset: 0; background: var(--slot); border-radius: 0 3px 0 0; clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .local-assets .tier-cap { clip-path: none; -webkit-mask: url("assets/game/ui/shop/tier_corner_cap.svg") right top / contain no-repeat; mask: url("assets/game/ui/shop/tier_corner_cap.svg") right top / contain no-repeat; }
  .tier-num { position: absolute; top: 3px; right: 4px; height: 9px; background: var(--off-black); -webkit-mask: var(--num) right top / 100% 100% no-repeat; mask: var(--num) right top / 100% 100% no-repeat; }
  .tier-num.t1 { width: 4px; --num: url("assets/game/ui/upgrades/tier_numbers_small_01.svg"); }
  .tier-num.t2 { width: 6px; --num: url("assets/game/ui/upgrades/tier_numbers_small_02.svg"); }
  .tier-num.t3 { width: 8px; --num: url("assets/game/ui/upgrades/tier_numbers_small_03.svg"); }
  .tier-num.t4 { width: 12px; --num: url("assets/game/ui/upgrades/tier_numbers_small_04.svg"); }
  .tier-text { position: absolute; top: 1px; right: 3px; font-family: var(--oracle); font-weight: 600; font-size: 10px; color: var(--off-black); }
  .note-badge { position: absolute; top: 3px; left: 3px; width: 19px; height: 17px; border-radius: 3px; background: var(--builds); box-shadow: 0 1px 2px #0009, inset 0 0 0 1px #ffffff40; display: grid; place-items: center; pointer-events: none; }
  .note-badge::before { content: ""; width: 10px; height: 8px; background: #fff; clip-path: polygon(0 0, 100% 0, 100% 72%, 46% 72%, 18% 100%, 24% 72%, 0 72%); }
  .imbue-tag { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); padding: 0 5px; border-radius: 2px; background: #10130De0; color: #E7C8FF; font-weight: 700; font-style: italic; font-size: 11px; line-height: 15px; letter-spacing: 1px; text-transform: uppercase; pointer-events: none; }

  .shop[data-filter="weapon"] .card:not(.slot-weapon),
  .shop[data-filter="spirit"] .card:not(.slot-spirit),
  .shop[data-filter="vitality"] .card:not(.slot-vitality) { opacity: .25; filter: grayscale(.8); }

  /* ---------- ability order ---------- */
  .ao-panel { width: 100%; margin-top: 10px; }
  .ao-wrap { overflow-x: auto; padding: 4px 8px; }
  .ao { border-collapse: separate; border-spacing: 0; width: 100%; }
  .ao th, .ao td { padding: 0; text-align: center; }
  .ao thead th { padding: 6px 0; font-family: var(--mono); font-size: 12px; font-weight: 700; color: #10130Db0; border-bottom: 1px solid #10130D33; }
  .ao tbody tr + tr > * { border-top: 1px solid #10130D26; }
  .ao .ao-ab { min-width: 200px; padding: 8px 10px 8px 4px; text-align: left; }
  .ao-ab-inner { display: flex; align-items: center; gap: 10px; cursor: help; border-radius: 3px; }
  .ao-ab-inner:focus-visible { outline: 2px solid var(--off-black); outline-offset: 2px; }
  .ao-ab img { width: 36px; height: 36px; border-radius: 50%; background: var(--off-black); padding: 4px; box-shadow: 0 1px 3px #0008; }
  .ao-key { font-family: var(--mono); font-weight: 700; color: #10130D99; width: 10px; }
  .ao-name { font-family: var(--oracle); font-weight: 600; font-size: 17px; line-height: 1.1; color: var(--off-black); }
  .ao td { min-width: 40px; height: 54px; }
  .ao-mark { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 3px; cursor: help; background: #10130D; color: var(--off-white); font-family: var(--oracle); font-weight: 600; font-size: 14px; box-shadow: 0 1px 3px #0007; }
  .ao-mark:focus-visible { outline: 2px solid var(--off-black); outline-offset: 2px; }
  .ao-unlock { background: #2f8f74; }
  .ao-t3 { color: var(--mods-gold); }
  .local-assets .ao-mark { width: 30px; height: 35px; border-radius: 0; background: url("assets/game/ui/tooltips/ability/ap_rect_default.webp") center / 100% 100% no-repeat; }
  .local-assets .ao-unlock { background-image: url("assets/game/ui/tooltips/ability/ap_rect_available.webp"); }
  .local-assets .ao-t3 { box-shadow: 0 0 0 1.5px var(--mods-gold), 0 1px 6px #0008; }

  .rc {
    --border: #575757; --backer: #564a48; --scale: .98; --tilt: 0deg;
    position: relative; width: 97px; height: 162px; padding: 0; border: 0; background: none; cursor: pointer;
    transform: scale(var(--scale)) rotate(var(--tilt)); transition: transform .12s ease, filter .12s ease;
    filter: saturate(.5) brightness(.7);
  }
  .rc:hover, .rc:focus-visible { filter: none; z-index: 20; }
  .rc-body { position: absolute; inset: 0; background: #ffefd70d; }
  /* Plain borders and <img> icons (no CSS masks): masks are blocked when the page is opened as a file. */
  .rc-backer { position: absolute; inset: 3px; border-radius: 3px; background: var(--backer); }
  .rc-shape { position: absolute; inset: 0; z-index: 1; border: var(--edge, 3px) solid var(--border); border-radius: 4px; box-shadow: 0 0 0 1px #00000070, inset 0 0 0 1px #00000050; pointer-events: none; }

  .rc.priority { --border: #92eac7; --backer: #74ddb3; --scale: 1.1; z-index: 3; }

  .cp-item { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 112px; text-align: center; }

  .cp-empty { margin: 8px 0; padding: 18px; border-radius: 4px; background: #10130D99; color: var(--text2); font-weight: 600; text-align: center; }

  /* ---------- tooltip ---------- */
  #tooltip {
    position: fixed; z-index: 50; top: 0; left: 0;

    background: #13160f; border: 1px solid var(--line2); border-radius: 3px;

  }

  .tt-head { display: flex; align-items: center; gap: 10px; padding: 12px; background: linear-gradient(100deg, var(--slot-dark, #2b3532), var(--slot-darker, #1a211f)); }
  .local-assets .slot-weapon .tt-head, .local-assets .slot-vitality .tt-head, .local-assets .slot-spirit .tt-head {

  .tt-icon { width: 38px; height: 38px; border-radius: 50%; background: #0007; padding: 3px; }
  .tf-list { display: grid; gap: 5px; }
  .tf-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 54px; align-items: center; gap: 8px; font-size: 12.5px; }
  .tf-label { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tf-label small { color: var(--faint); font-size: 11px; font-weight: 600; }
  .tf-value { color: var(--text2); text-align: right; white-space: nowrap; }
  .tf-bar { position: relative; height: 6px; border-radius: 3px; background: #ffffff14; }
  .tf-bar::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: #ffffff40; }
  .tf-bar span { position: absolute; top: 0; bottom: 0; }
  .tf-bar .up { background: #7BBA1D; border-radius: 0 3px 3px 0; }
  .tf-bar .down { background: #e8264d; border-radius: 3px 0 0 3px; }
  .tt-title { display: flex; flex-direction: column; min-width: 0; text-shadow: 0 1px 3px #000, 0 0 10px #000a; }
  .tt-title strong { font-family: var(--oracle); font-weight: 600; font-size: 22px; line-height: 1.1; }
  .tt-sub { font-weight: 600; font-size: 12px; color: #fffd; text-transform: uppercase; letter-spacing: .12em; }
  .tt-cost { margin-left: auto; display: inline-flex; align-items: center; font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--shard); background: #000b; padding: 2px 8px; border-radius: 3px; }
  .soul { display: inline-block; flex: none; width: .5em; height: 1em; margin-right: .35em; background: var(--shard); }
  .local-assets .soul { -webkit-mask: url("assets/game/ui/hud/icons/icon_soul.svg") center / contain no-repeat; mask: url("assets/game/ui/hud/icons/icon_soul.svg") center / contain no-repeat; }
  html:not(.local-assets) .soul { width: .55em; height: .55em; margin: 0 .45em 0 .1em; transform: rotate(45deg); border-radius: 1px; }
  .tt-note { margin: 10px 12px 0; padding: 8px 10px; background: #4D7EC81f; border-left: 3px solid var(--builds-light); border-radius: 0 3px 3px 0; color: var(--text); }
  .tt-note b { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--builds-light); }
  .tt-imbue { display: flex; align-items: center; gap: 8px; margin: 10px 12px 0; color: #E7C8FF; font-weight: 600; }
  .tt-imbue img { width: 24px; height: 24px; border-radius: 50%; background: #0008; padding: 2px; }
  .tt-sec { padding: 10px 12px; }
  .tt-sec + .tt-sec { border-top: 1px solid #ffffff14; }

  .hl { color: #fff; font-weight: 600; }
  .tt-stats { display: grid; gap: 2px 12px; }
  .tt-stats.big { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); margin-bottom: 6px; }

  .tt-stats + .tt-stats { margin-top: 4px; }
  .stat { display: flex; align-items: baseline; gap: 6px; }
  .stat-v { font-family: var(--mono); font-weight: 700; color: #fff; }
  .stat-l { color: var(--muted); }
  .tt-tiers { display: grid; gap: 6px; padding: 0 12px 12px; }
  .tt-tier { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 6px 8px; border: 1px solid #ffffff1a; border-radius: 3px; color: var(--text2); background: #0005; }
  .tt-tier.on { border-color: var(--hero); background: color-mix(in srgb, var(--hero) 14%, #0006); }
  .tier-badge { font-family: var(--mono); font-weight: 700; font-size: 12px; color: var(--hero); white-space: nowrap; padding-top: 1px; }
  .tt-ability .tt-head { background: #0006; }
  .tt-ability .tt-desc { padding: 10px 12px 0; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<header class="topbar">
  <a class="brand" href="?">Deadlock<span>Build Viewer</span></a>
  <nav class="topnav" aria-label="Pages">
    <a href="?" id="navHome">Meta Builds</a>
    <a href="?view=roster" id="navRoster">Best Roster</a>
    <a href="?view=counter" id="navCounter">Counter Picks</a>
  </nav>
  <form class="lookup" id="lookup" autocomplete="off">
    <input id="buildId" name="id" inputmode="numeric" placeholder="Enter a build ID, e.g. 439842" aria-label="Build ID">
    <button class="pill" type="submit">View Build</button>
  </form>
</header>

<main>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <section id="home" hidden></section>
  <section id="roster" hidden></section>
  <section id="counter" hidden></section>
  <article id="build" class="shop" data-filter="all" hidden></article>
  <footer>
    <p id="assetNote"></p>
    <p>Build and item data from <a href="https://deadlock-api.com" target="_blank" rel="noopener">deadlock-api.com</a>. Fan-made, not affiliated with Valve.</p>
  </footer>
</main>

<div id="tooltip" role="tooltip" hidden></div>

<script>
const API_ROOT = 'https://api.deadlock-api.com';
const API = `${API_ROOT}/v1`;
const MANIFEST_URL = 'assets/game/manifest.json';
const AP_COST = { 1: 1, 2: 2, 3: 5 };
const CATEGORY_NAMES = { Early: 'Early Game', Mid: 'Mid Game', Late: 'Late Game' };
// In-game category widths are in panel units sized for 80px cards; ours are 84px.
const CATEGORY_SCALE = 1.05;
const CARD_SLOT = 92; // card width plus the gap between cards
const TABS = [
  { key: 'all', label: 'Whole build', tall: 'shop/catalog/catalog_shop_tab_builds', small: 'shop/catalog/catalog_shop_tab_builds_sm' },
  { key: 'weapon', label: 'Highlight weapon items', small: 'shop/catalog/catalog_shop_tab_weapon_sm' },
  { key: 'spirit', label: 'Highlight spirit items', small: 'shop/catalog/catalog_shop_tab_spirit_sm' },
  { key: 'vitality', label: 'Highlight vitality items', small: 'shop/catalog/catalog_shop_tab_vitality_sm' },
];

const $ = (sel, root = document) => root.querySelector(sel);
const state = { assets: null, tags: new Map(), hero: null, versions: [], author: null, manifest: null, filter: 'all', infoOpen: false };

try { state.infoOpen = localStorage.getItem('infoOpen') === '1'; } catch {}

/* ---------- small helpers ---------- */

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'style') node.style.cssText = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child != null && child !== false) node.append(child);
  }
  return node;
}

const soulIcon = () => el('span', { class: 'soul', 'aria-hidden': 'true' });
const fmtNum = n => Number(n).toLocaleString();
const fmtDate = ts => new Date(ts * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';

function categoryName(name) {
  const m = /^#Citadel_HeroBuilds_(.+)$/.exec(name || '');
  if (!m) return name || 'Untitled';
  return CATEGORY_NAMES[m[1]] ?? m[1].replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2');
}

/* ---------- game assets ---------- */

// Maps a deadlock-api.com image URL to the copy extracted from the local game install,
// falling back to the remote URL when it isn't there or the game has been patched since extraction.
function assetUrl(...urls) {
  if (!state.artOutdated) {
    for (const url of urls) {
      const key = /\/assets-api-res\/((?:images|icons)\/.+)\.\w+$/.exec(url ?? '')?.[1];
      const local = key && state.manifest?.images?.[key];
      if (local) return local;
    }
  }
  return urls.find(Boolean) ?? null;
}
const uiAsset = key => state.manifest?.ui?.[key] ?? null;
const isLocal = url => !!url && !/^https?:/i.test(url);
const iconOf = a => a ? assetUrl(a.image_webp, a.image, a.shop_image_webp, a.shop_image) : null;

// <img> for game art that quietly swaps to the remote copy if the local file is missing.
function gameImg(urls, props = {}) {
  const src = assetUrl(...urls);
  return el('img', { ...props, src, 'data-fallback': isLocal(src) ? urls.find(Boolean) : null });
}
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName === 'IMG' && img.dataset.fallback) {
    img.src = img.dataset.fallback;
    img.removeAttribute('data-fallback');
  }
}, true);

const loadManifest = () => once('manifest', async () => {
  const [manifest, live] = await Promise.all([
    fetch(MANIFEST_URL, { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)).catch(() => null),
    getJSON(`${API}/assets/steam-info`).catch(() => null),
  ]);
  return applyManifest(manifest, live);
});

// Puts the extracted-art manifest into use (also called with the snapshot's copy for an instant start).
function applyManifest(manifest, live) {
  state.manifest = manifest;
  // If Deadlock has been patched since the art was extracted, hero/item/ability images could be
  // out of date, so use deadlock-api.com's copies (updated with each patch) until the art is refreshed.
  const extracted = Number(manifest?.game_version), current = Number(live?.client_version);
  state.artOutdated = !!manifest && extracted > 0 && current > extracted;
  document.documentElement.classList.toggle('local-assets', !!manifest);
  const note = $('#assetNote');
  const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (state.artOutdated) {
    note.replaceChildren(`Deadlock is on version ${current} but the extracted art is from version ${extracted}, so hero and item images come from deadlock-api.com for now.`,
      ...(local ? [' Restart the viewer (', el('code', { text: 'python tools/serve.py' }), ') to refresh the art from your updated game.'] : []));
  } else if (manifest) {
    note.replaceChildren(`Images, UI art and fonts extracted from your Deadlock install (game version ${manifest.game_version ?? 'unknown'}, ${new Date(manifest.extracted_at).toLocaleDateString()}).`);
  } else {
    note.replaceChildren('Game assets not found, so images come from deadlock-api.com. ', localDataHint());
  }
  return manifest;
}

// Browsers block a page opened straight from disk (file://) from reading the local data files, so the
// extracted art, match sample and community talk all need the page served by tools/serve.py.
const SERVER_URL = 'http://localhost:8765';
function localDataHint() {
  if (location.protocol === 'file:') {
    const here = new URLSearchParams(location.search).get('view') === 'roster' ? `${SERVER_URL}/?view=roster` : SERVER_URL;
    return el('span', {}, 'This page was opened as a file, which can’t read the local game art and match data. Start ',
      el('code', { text: 'python tools/serve.py' }), ' and open ', el('a', { href: here, text: here }), ' instead.');
  }
  return el('span', {}, 'Start the site with ', el('code', { text: 'python tools/serve.py' }), ' to use your game art and the full match model.');
}

/* ---------- patches: every stat is measured since the latest game update ---------- */

const PATCH_MIN_HOURS = 24; // a new patch needs a day of matches before the stats switch to it
const MAX_WINDOW_DAYS = 30;

// Game updates from the official changelog and Steam news, newest first. Titles carry the
// patch date ("09-29-2026", "Minor Update - 10-05-2026").
const loadPatches = () => once('patches', async () => {
  const rows = await getJSON(`${API_ROOT}/v2/patches`).catch(() => []);
  const found = [];
  for (const r of rows) {
    const m = /(\d{2})-(\d{2})-(\d{4})/.exec(r.title ?? '');
    if (!m) continue;
    const day = Date.UTC(+m[3], +m[1] - 1, +m[2]) / 1000;
    const posted = Date.parse(r.pub_date) / 1000;
    // Posts usually go up within hours of the patch; otherwise assume a typical evening (UTC) release.
    const time = posted >= day && posted - day < 36 * 3600 ? posted : day + 20 * 3600;
    found.push({ time, title: r.title.trim(), link: r.link });
  }
  found.sort((a, b) => b.time - a.time);
  return found.filter((p, i) => !found.slice(0, i).some(q => Math.abs(q.time - p.time) < 12 * 3600));
});

// The window all stats use: since the newest patch that has a full day of matches.
const loadDataWindow = () => once('window', async () => {
  const patches = await loadPatches();
  const now = Date.now() / 1000;
  const patch = patches.find(p => now - p.time >= PATCH_MIN_HOURS * 3600) ?? null;
  const pending = patches.find(p => p.time <= now && now - p.time < PATCH_MIN_HOURS * 3600) ?? null;
  const since = Math.floor(Math.max(patch?.time ?? 0, now - MAX_WINDOW_DAYS * 86400));
  return { since, patch, pending, days: (now - since) / 86400 };
});

function windowText(w, detail = '') {
  const days = Math.max(1, Math.round(w.days));
  const span = `${days} ${days === 1 ? 'day' : 'days'}`;
  const extra = detail ? `, ${detail}` : '';
  return w.patch && w.patch.time >= w.since ? `since the ${w.patch.title} update (${span}${extra})` : `over the last ${span}${detail ? ` (${detail})` : ''}`;
}

function windowNotes(w) {
  return [
    w.patch && w.patch.time >= w.since && el('a', { href: w.patch.link, target: '_blank', rel: 'noopener', text: 'Patch notes' }),
    w.pending && ` · New update “${w.pending.title}” landed ${Math.max(1, Math.round((Date.now() / 1000 - w.pending.time) / 3600))}h ago; stats switch to it once it has a full day of matches.`,
  ];
}

// Game text arrives as HTML with highlight spans, inline SVG icons and
// {g:...} binding tokens. Keep only text, <br> and highlight spans.
function richText(html) {
  const cleaned = String(html)
    .replace(/\{g:[^:}]+:'([^']+)'\}/g, '[$1]')
    .replace(/\{[^}]*\}/g, '');
  const doc = new DOMParser().parseFromString(`<div>${cleaned}</div>`, 'text/html');
  const out = document.createDocumentFragment();
  (function walk(src, dst) {
    for (const node of src.childNodes) {
      if (node.nodeType === Node.TEXT_NODE) { dst.append(node.textContent); continue; }
      if (node.nodeType !== Node.ELEMENT_NODE) continue;
      const tag = node.tagName.toLowerCase();
      if (tag === 'br') dst.append(el('br'));
      else if (['svg', 'img', 'style', 'script'].includes(tag)) continue;
      else if (tag === 'span' && node.classList.contains('highlight')) { const s = el('span', { class: 'hl' }); walk(node, s); dst.append(s); }
      else walk(node, dst);
    }
  })(doc.body.firstChild, out);
  return out;
}

function fmtProp(p) {
  if (!p?.label || p.value == null || p.value === '') return null;
  const num = parseFloat(p.value);
  if (num === 0 || (p.disable_value != null && String(p.disable_value) === String(p.value))) return null;
  const prefix = (p.prefix || '').replace('{s:sign}', num > 0 ? '+' : '').replace(/\{[^}]*\}/g, '');
  const postfix = (p.postfix || '').replace(/\{[^}]*\}/g, '');
  return { label: p.label, value: `${prefix}${p.value}${postfix}` };
}

/* ---------- data loading ---------- */

const memo = new Map();
function once(key, fn) {
  if (!memo.has(key)) memo.set(key, fn().catch(err => { memo.delete(key); throw err; }));
  return memo.get(key);
}

// Rate-limited requests (429) wait and retry a few times before giving up.
async function getJSON(url) {
  for (let attempt = 0; ; attempt++) {
    const res = await fetch(url);
    if (res.ok) return res.json();
    if (res.status !== 429 || attempt >= 3) throw new Error(`${url.startsWith('http') ? 'deadlock-api.com' : 'The local server'} returned ${res.status}`);
    const wait = Number(res.headers.get('retry-after')) || 2 * 2 ** attempt;
    await new Promise(r => setTimeout(r, Math.min(wait, 20) * 1000));
  }
}

const indexItems = (list, full) => ({ byId: new Map(list.map(i => [i.id, i])), byClass: new Map(list.map(i => [i.class_name, i])), full });
const loadAssets = () => once('items', async () => indexItems(await getJSON(`${API}/assets/items`), true));

// "Fast" loaders: what the first screens need (names, icons, win counts), served instantly from the
// precomputed snapshot when there is one. Without it they fall back to the full data below.
const loadAssetsFast = () => once('assetsFast', loadAssets);
const loadHeroesFast = () => once('heroesFast', () => loadHeroList());
const loadMetaFast = rank => once(`metaFast:${rank}`, () => loadMeta(rank));

// Swaps in the full item data (tooltips, build pages) once it has downloaded in the background.
function upgradeAssets() {
  if (state.assets?.full) return;
  loadAssets().then(full => {
    state.assets = full;
    if (tipAnchor) showTip(tipAnchor);
  }).catch(() => {});
}
const loadTags = () => once('tags', async () => new Map((await getJSON(`${API}/assets/build-tags`)).map(t => [t.id, t])));
const loadHero = id => once(`hero:${id}`, () => getJSON(`${API}/assets/heroes/${id}`));
const loadAuthor = id => once(`author:${id}`, async () => (await getJSON(`${API}/players/steam?account_ids=${id}`))[0] ?? null);

let requestSeq = 0;

// Always shows the build's latest version.
async function loadBuild(id) {
  const seq = ++requestSeq;
  $('#build').hidden = true;
  $('#home').hidden = true;
  $('#roster').hidden = true;
  showStatus('loading', `Loading build ${id}…`);
  try {
    const [builds, assets, tags] = await Promise.all([
      getJSON(`${API}/builds?build_id=${id}&only_latest=true`),
      loadAssets(),
      loadTags().catch(() => new Map()),
      loadManifest(),
    ]);
    if (seq !== requestSeq) return;
    if (!Array.isArray(builds) || builds.length === 0) {
      showStatus('error', `No build found with ID ${id}`,
        'It may be private or deleted, or deadlock-api.com may not have indexed it yet. Double-check the ID from the in-game build browser.');
      return;
    }
    const favorites = builds.map(b => b.num_favorites).find(n => n != null);
    const versions = builds.map(b => b.hero_build).sort((a, b) => b.version - a.version);
    const hero = await loadHero(versions[0].hero_id).catch(() => null);
    if (seq !== requestSeq) return;

    Object.assign(state, { assets, tags, hero, versions, favorites, author: null, partial: false });
    render(versions[0]);
    hideStatus();

    // Meta builds get a quick how-to-play summary above the name.
    metaBuildId(versions[0].hero_id).then(metaId => {
      if (seq !== requestSeq || metaId !== versions[0].hero_build_id) return;
      $('#build > .shop-panel')?.prepend(renderPlaySummary(versions[0]));
    }).catch(() => {});

    loadAuthor(versions[0].author_account_id).then(author => {
      if (seq !== requestSeq || !author) return;
      state.author = author;
      $('#author')?.replaceWith(renderAuthor());
    }).catch(() => {});
  } catch (err) {
    if (seq !== requestSeq) return;
    showStatus('error', 'Couldn’t load that build', `${err.message}. Check your connection and try again.`,
      el('button', { class: 'pill', type: 'button', onclick: () => loadBuild(id), text: 'Retry' }));
  }
}

/* ---------- status ---------- */

function showStatus(kind, title, detail, action) {
  const box = $('#status');
  box.className = `status ${kind}`;
  box.hidden = false;
  box.replaceChildren(...[
    kind === 'loading' && el('div', { class: 'spinner', 'aria-hidden': 'true' }),
    el('h2', { text: title }),
    detail && el('p', { text: detail }),
    action,
  ].filter(Boolean));
}
const hideStatus = () => { $('#status').hidden = true; };

/* ---------- home: meta builds for every hero ---------- */

const CORE_MIN_PICK = 0.4; // core items: bought by at least this share of a hero's players
const POPULAR_BUILD_FAVORITES = 500; // below this, post-patch build choices are too thin on their own
const HOME_SORTS = { pick: 'Most played', win: 'Highest win rate', name: 'Name' };
const HOME = { rank: 'all', sort: 'pick', query: '', seq: 0, heroes: null, meta: null, window: null, builds: new Map() };

const pct1 = n => `${(n * 100).toFixed(1)}%`;

function relativeDay(ts) {
  const days = Math.floor((Date.now() / 1000 - ts) / 86400);
  return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days < 60 ? `${days} days ago` : fmtDate(ts);
}

// Candidate builds for a hero: the all-time and this week's most-favorited builds updated since the
// latest patch. Right after a patch, when few popular builds have been updated yet, popular builds
// from before it are added as backups.
const loadRecentBuilds = heroId => once(`recent:${heroId}`, async () => {
  const { since } = await loadDataWindow();
  const query = (sort, limit, from) => getJSON(`${API}/builds?hero_id=${heroId}&only_latest=true&sort_by=${sort}&sort_direction=desc&limit=${limit}${from ? `&min_unix_timestamp=${from}` : ''}`);
  let builds = (await Promise.all([query('favorites', 10, since), query('weekly_favorites', 6, since)])).flat();
  if (builds.length < 3 || !builds.some(b => (b.num_favorites ?? 0) >= POPULAR_BUILD_FAVORITES)) {
    builds = builds.concat(await query('favorites', 10, Math.floor(Date.now() / 1000) - MAX_WINDOW_DAYS * 86400));
  }
  if (!builds.length) builds = await query('favorites', 10);
  const seen = new Set();
  return builds.filter(b => !seen.has(b.hero_build.hero_build_id) && seen.add(b.hero_build.hero_build_id));
});

function coreItems(heroId, meta = HOME.meta) {
  const h = meta?.byHero.get(heroId);
  if (!h?.matches) return [];
  return h.items
    .filter(r => r.matches / h.matches >= CORE_MIN_PICK && isShopItem(r.item_id))
    .sort((a, b) => a.avg_buy_time_s - b.avg_buy_time_s)
    .map(r => state.assets.byId.get(r.item_id));
}

// The candidate containing the most of what players actually buy since the patch. Ties go to builds
// updated since the patch, then to more favorites.
function pickBuild(heroId, core, found = HOME.builds.get(heroId), since = HOME.window?.since ?? 0) {
  if (!Array.isArray(found) || !found.length) return null;
  const coreIds = core.map(i => i.id);
  let best = null;
  for (const entry of found) {
    const hb = entry.hero_build;
    const ids = new Set((hb.details?.mod_categories ?? []).flatMap(c => (c.mods ?? []).map(m => m.ability_id)));
    const c = {
      build: hb,
      hits: coreIds.filter(id => ids.has(id)).length,
      current: hb.last_updated_timestamp >= since,
      favorites: entry.num_favorites ?? 0,
    };
    const better = !best || c.hits > best.hits
      || (c.hits === best.hits && (c.current > best.current || (c.current === best.current && c.favorites > best.favorites)));
    if (better) best = c;
  }
  return { ...best, total: coreIds.length };
}

// Proven builds: how often players who chose each build actually won with it. A build needs enough
// games from enough different players (so it isn't one great player's personal build), and small
// samples are pulled toward the average of all builds for that hero.
const PROVEN_DAYS = 14;
const PROVEN_MIN_GAMES = 60;
const PROVEN_MIN_PLAYERS = 10;
const PROVEN_SHRINK = 150; // games' worth of "average build" mixed into every build's record

const loadBuildStats = (heroId, rank) => once(`buildStats:${heroId}:${rank}`, async () => {
  const from = Math.floor(Date.now() / 1000) - PROVEN_DAYS * 86400;
  return getJSON(`${API}/analytics/hero-build-stats/${heroId}?min_unix_timestamp=${from}${rank === 'high' ? '&min_average_badge=90' : ''}`);
});

const loadBuild1 = id => once(`build:${id}`, async () => (await getJSON(`${API}/builds?build_id=${id}&only_latest=true`))[0] ?? null);

async function provenBuild(heroId, rank) {
  let rows = await loadBuildStats(heroId, rank);
  const usable = r => r.matches >= PROVEN_MIN_GAMES && r.players >= PROVEN_MIN_PLAYERS;
  // Phantom+ alone can be too few games per build; then all ranks decide.
  if (rank === 'high' && !rows.some(usable)) { rows = await loadBuildStats(heroId, 'all'); rank = 'all'; }
  const games = rows.reduce((s, r) => s + r.matches, 0);
  if (!games) return null;
  const base = rows.reduce((s, r) => s + r.wins, 0) / games;
  const ranked = rows.filter(usable)
    .map(r => ({ ...r, score: (r.wins + PROVEN_SHRINK * base) / (r.matches + PROVEN_SHRINK) }))
    .sort((a, b) => b.score - a.score);
  // Skip builds that have since been made private or deleted.
  for (const r of ranked.slice(0, 4)) {
    const entry = await loadBuild1(r.hero_build_id).catch(() => null);
    if (entry) return { source: 'proven', build: entry.hero_build, favorites: entry.num_favorites ?? 0, wins: r.wins, matches: r.matches, players: r.players, base, rank };
  }
  return null;
}

// The build the front page recommends for a hero: the best proven build, or, when no build has
// enough games yet, the popular build that best matches what players buy since the patch.
const loadHeroPick = (heroId, rank) => once(`heroPick:${heroId}:${rank}`, async () => {
  const proven = await provenBuild(heroId, rank).catch(() => null);
  if (proven) return proven;
  state.assets ??= await loadAssets();
  const [meta, found, { since }] = await Promise.all([loadMeta(rank), loadRecentBuilds(heroId), loadDataWindow()]);
  const pick = pickBuild(heroId, coreItems(heroId, meta), found, since);
  return pick ? { source: 'popular', ...pick } : null;
});

async function metaBuildId(heroId) {
  return (await loadHeroPick(heroId, HOME.rank))?.build.hero_build_id ?? null;
}

/* top players' meta builds */

// Meta builds learned from what Ascendant+ players actually buy (tools/topbuilds.py): the playstyle
// they win with, its core items in real buy order split by game phase, and the common situational
// picks. Shown in the same shop layout, with the closest saved build to copy in-game.
const loadTopBuilds = () => once('topBuilds', () => getJSON('data/top_builds.json').catch(() => null));
const STYLE_NAMES = { gun: 'Gun', spirit: 'Spirit', hybrid: 'Hybrid' };
const mmss = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const topCore = tb => tb.phases.flatMap(p => p.items);

// The ability order top players use most for this hero over the same week.
const loadTopAbilityOrder = heroId => once(`topAo:${heroId}`, async () => {
  const from = Math.floor(Date.now() / 1000) - 7 * 86400;
  const rows = await getJSON(`${API}/analytics/ability-order-stats?hero_id=${heroId}&min_matches=10&min_average_badge=100&min_unix_timestamp=${from}`).catch(() => []);
  const best = rows.reduce((a, b) => (!a || b.matches > a.matches ? b : a), null);
  const seen = new Set();
  return (best?.abilities ?? []).map(id => {
    const unlock = !seen.has(id);
    seen.add(id);
    return { ability_id: id, currency_type: unlock ? 2 : 1 };
  });
});

// The saved community build closest to the top players' build: how much of the core it covers,
// minus main items that top players rarely buy, and minus items whose buyers measurably lose more.
// Readable builds win ties.
const closestSavedBuild = (heroId, tb) => once(`closest:${heroId}`, async () => {
  const [recent, stats] = await Promise.all([loadRecentBuilds(heroId).catch(() => []), loadBuildStats(heroId, 'all').catch(() => [])]);
  const known = new Set(recent.map(e => e.hero_build.hero_build_id));
  const played = stats.filter(r => r.matches >= 20 && !known.has(r.hero_build_id)).sort((a, b) => b.matches - a.matches).slice(0, 8);
  const entries = [...recent, ...(await Promise.all(played.map(r => loadBuild1(r.hero_build_id).catch(() => null)))).filter(Boolean)];
  const core = topCore(tb);
  const common = new Set([...core, ...tb.situational].map(s => s.id));
  let best = null;
  for (const e of entries) {
    const cats = e.hero_build.details?.mod_categories ?? [];
    const all = new Set(cats.flatMap(c => c.mods ?? []).map(m => m.ability_id));
    const main = cats.filter(c => !c.optional).flatMap(c => c.mods ?? []).map(m => m.ability_id);
    const covered = core.filter(s => all.has(s.id)).length;
    const offMeta = main.filter(id => !common.has(id)).length;
    const losers = main.filter(id => (tb.impacts?.[id] ?? 0) <= -0.02);
    const readable = cats.every(c => /^[a-z#][\w '&+#-]{2,40}$/i.test(c.name ?? '') && !/untitled/i.test(c.name));
    const score = covered / Math.max(1, core.length) - (0.5 * offMeta) / Math.max(1, main.length) - 0.15 * losers.length + (readable ? 0.02 : 0);
    if (!best || score > best.score) best = { score, covered, total: core.length, losers, build: e.hero_build, favorites: e.num_favorites ?? 0 };
  }
  return best;
});

function topBuildObject(hero, tb, abilityOrder, updated, heroNames) {
  const style = STYLE_NAMES[tb.style];
  const impact = s => (s.impact == null ? ''
    : ` Players who buy it win ${signedPct(s.impact)} ${s.impact >= 0 ? 'more' : 'less'} often than those who skip it.`);
  const note = s => `${pct(s.rate)} of top ${style.toLowerCase()} ${hero.name} players buy this, usually around ${mmss(s.time)}${s.soldRate >= 0.5 ? ' (often sold later for a slot)' : ''}.${impact(s)}`;
  const cats = tb.phases.map(p => ({ name: p.name, description: 'Buy in order from left to right', mods: p.items.map(s => ({ ability_id: s.id, annotation: note(s) })) }));
  if (tb.situational.length) {
    cats.push({ name: 'Situational', optional: true, description: 'Strongest first: picks that help depending on the game',
      mods: tb.situational.map(s => ({ ability_id: s.id, annotation: note(s) })) });
  }
  // The hero's worst common matchups, with the items that most improve their win rate there.
  for (const m of tb.matchups ?? []) {
    const enemy = heroNames.get(m.enemy) ?? 'this hero';
    cats.push({ name: `Against ${enemy}`, optional: true,
      description: `Top players win only ${pct(m.winRate)} of ${fmtNum(m.games)} games vs ${enemy}; these help most`,
      mods: m.items.map(s => ({ ability_id: s.id, annotation: `Against ${enemy}, top players who buy this win ${signedPct(s.diff)} more often (${pct(s.with)} vs ${pct(s.without)}), usually around ${mmss(s.time)}.` })) });
  }
  return {
    synthetic: true, hero_id: hero.id, hero_build_id: null, version: 1, last_updated_timestamp: updated, tags: [],
    name: `${hero.name} · Top Players’ ${style} Build`,
    details: { mod_categories: cats, ability_order: { currency_changes: abilityOrder } },
  };
}

function goTop(heroId) {
  const url = new URL(location.href);
  url.search = `?top=${heroId}`;
  history.pushState(null, '', url);
  scrollTo(0, 0);
  route();
}

async function loadTopBuild(heroId) {
  const seq = ++requestSeq;
  $('#build').hidden = true;
  $('#home').hidden = true;
  $('#roster').hidden = true;
  showStatus('loading', 'Loading the top players’ build…');
  try {
    const [tops, fastAssets, fastHeroes] = await Promise.all([loadTopBuilds(), loadAssetsFast(), loadHeroesFast(), loadManifest()]);
    if (seq !== requestSeq) return;
    const tb = tops?.heroes?.[heroId];
    const listed = fastHeroes.find(h => h.id === heroId);
    if (!tb) {
      showStatus('error', `No top-player build for ${listed?.name ?? 'this hero'} yet`,
        location.protocol === 'file:' || !tops ? 'The top players’ builds come from the local server. Open the site at http://localhost:8765 with python tools/serve.py running.'
          : 'Not enough Ascendant+ games with this hero in the last week. Its recommended community build is on the front page.');
      return;
    }
    const heroNames = new Map(fastHeroes.map(h => [h.id, h.name]));
    const show = build => {
      render(build);
      $('#build > .shop-panel')?.prepend(renderPlaySummary(build));
      hideStatus();
    };
    // With the snapshot, the items and notes draw at once; the ability order, the closest saved
    // build and the duel matchups follow when the full game data has downloaded.
    if (listed && !fastAssets.full) {
      if (!state.assets?.full) state.assets = fastAssets;
      const preview = topBuildObject(listed, tb, [], tops.updated, heroNames);
      Object.assign(state, { tags: new Map(), hero: listed, heroNames, versions: [preview], favorites: null, author: null, top: { tb, tops, pending: true }, partial: true });
      show(preview);
    }
    const [assets, tags, hero, abilityOrder, closest] = await Promise.all([
      loadAssets(), loadTags().catch(() => new Map()), loadHero(heroId), loadTopAbilityOrder(heroId), closestSavedBuild(heroId, tb).catch(() => null)]);
    if (seq !== requestSeq) return;
    const build = topBuildObject(hero, tb, abilityOrder, tops.updated, heroNames);
    Object.assign(state, { assets, tags, hero, heroNames, versions: [build], favorites: null, author: null, top: { tb, closest, tops }, partial: false });
    show(build);
  } catch (err) {
    if (seq !== requestSeq) return;
    showStatus('error', 'Couldn’t load the top players’ build', err.message,
      el('button', { class: 'pill', type: 'button', onclick: () => loadTopBuild(heroId), text: 'Retry' }));
  }
}

function showHome() {
  requestSeq++;
  hideTip();
  hideStatus();
  $('#build').hidden = true;
  $('#roster').hidden = true;
  $('#buildId').value = '';
  $('#backdrop').style.backgroundImage = '';
  document.title = 'Deadlock Meta Builds';
  const home = $('#home');
  home.hidden = false;
  if (!home.firstChild) home.append(renderHomeShell());
  loadHome();
}

function renderHomeShell() {
  return el('div', { class: 'shop-panel' },
    el('header', { class: 'build-header' },
      el('h1', { class: 'build-title', text: 'Meta Builds' }),
      el('div', { class: 'hdr-btns' },
        el('input', { class: 'home-search', type: 'search', placeholder: 'Find a hero', 'aria-label': 'Find a hero', value: HOME.query,
          oninput: e => { HOME.query = e.target.value; renderHomeGrid(); } }),
        el('select', { class: 'pill', 'aria-label': 'Sort heroes', onchange: e => { HOME.sort = e.target.value; renderHomeGrid(); } },
          Object.entries(HOME_SORTS).map(([value, text]) => el('option', { value, text, selected: HOME.sort === value }))),
        el('select', { class: 'pill', 'aria-label': 'Match data from', onchange: e => { HOME.rank = e.target.value; loadHome(); } },
          el('option', { value: 'all', text: 'All ranks', selected: HOME.rank === 'all' }),
          el('option', { value: 'high', text: 'Phantom+', selected: HOME.rank === 'high' })))),
    el('div', { class: 'shop-body' },
      el('div', { class: 'section-head' }, el('h2', { class: 'section-title', text: 'Tier List' })),
      el('p', { class: 'home-note', id: 'tierNote' }),
      el('div', { class: 'tier-list', id: 'tierList' }),
      el('div', { class: 'section-head home-section' }, el('h2', { class: 'section-title', text: 'Builds by Hero' })),
      el('p', { class: 'home-note', id: 'homeNote' }),
      el('div', { class: 'hero-grid', id: 'heroGrid' })));
}

async function loadHome() {
  const seq = ++HOME.seq;
  if (HOME.tierFor !== HOME.rank) loadTierList();
  $('#homeNote').textContent = 'Loading heroes and match data since the latest patch…';
  try {
    const [heroes, meta, assets, , dataWindow, top] = await Promise.all([loadHeroesFast(), loadMetaFast(HOME.rank), loadAssetsFast(), loadManifest(), loadDataWindow(), loadTopBuilds()]);
    if (seq !== HOME.seq) return;
    // The cards only need names and icons; full item details arrive in the background for tooltips.
    if (!state.assets?.full) state.assets = assets;
    upgradeAssets();
    Object.assign(HOME, { heroes, meta, window: dataWindow, top });
    renderHomeGrid();
    // Heroes without a top players' build get a community build, streamed in per hero.
    const rank = HOME.rank;
    await mapLimit(heroes.filter(h => !top?.heroes?.[h.id]), 6, async hero => {
      let pick;
      try {
        pick = (await loadHeroPick(hero.id, rank)) ?? { none: true };
      } catch {
        pick = { error: true };
      }
      if (seq !== HOME.seq) return;
      HOME.builds.set(hero.id, pick);
      updateHeroBuild(hero.id);
    });
  } catch (err) {
    if (seq !== HOME.seq) return;
    $('#homeNote').replaceChildren(`Couldn’t load meta data (${err.message}). `,
      el('button', { class: 'pill', type: 'button', onclick: loadHome, text: 'Retry' }));
  }
}

function renderHomeGrid() {
  const grid = $('#heroGrid');
  if (!grid || !HOME.heroes || !HOME.meta) return;
  const total = HOME.meta.totalMatches;
  const query = HOME.query.trim().toLowerCase();
  const sorts = {
    pick: (a, b) => b.pickRate - a.pickRate,
    win: (a, b) => b.winRate - a.winRate,
    name: (a, b) => a.hero.name.localeCompare(b.hero.name),
  };
  const list = HOME.heroes
    .filter(hero => !query || hero.name.toLowerCase().includes(query))
    .map(hero => {
      const h = HOME.meta.byHero.get(hero.id);
      const matches = h?.matches ?? 0;
      const tb = HOME.top?.heroes?.[hero.id];
      const core = tb ? topCore(tb).map(s => state.assets.byId.get(s.id)).filter(Boolean) : coreItems(hero.id);
      return { hero, matches, winRate: matches ? h.wins / matches : 0, pickRate: total ? matches / total : 0, core, tb };
    })
    .sort(sorts[HOME.sort]);
  grid.replaceChildren(...list.map(heroCard));
  if (!list.length) grid.append(el('p', { class: 'home-note', text: `No hero matches “${HOME.query}”.` }));
  $('#homeNote').replaceChildren(`${list.length === HOME.heroes.length ? 'Every hero' : `${list.length} of ${HOME.heroes.length} heroes`} with the items players buy most ${windowText(HOME.window)}, and the community build that actually wins most: the best record over the last ${PROVEN_DAYS} days among builds played in ${PROVEN_MIN_GAMES}+ games by ${PROVEN_MIN_PLAYERS}+ different players. Based on ${fmtNum(Math.round(total))} ${HOME.rank === 'high' ? 'Phantom+ ' : ''}matches. Click a hero to open their build. `,
    ...windowNotes(HOME.window).filter(Boolean));
}

function miniItem(item) {
  const glyph = item.image ? assetUrl(item.image_webp, item.image) : null;
  const painting = assetUrl(item.shop_image_webp, item.shop_image);
  return el('span', { class: `hc-item slot-${item.item_slot_type}`, 'data-tip': `item:${item.id}`, tabindex: 0, 'aria-label': item.name },
    isLocal(glyph) ? el('span', { class: 'glyph', style: `--icon:url("${glyph}")` })
      : el('img', { src: glyph || painting, alt: '', loading: 'lazy' }));
}

function heroCard({ hero, matches, winRate, pickRate, core, tb }) {
  const images = hero.images ?? {};
  return el('article', {
    class: 'hero-card', id: `hc-${hero.id}`, style: `--hero:${hero.colors?.style_hex ?? '#c9b48a'}`,
    onclick: e => {
      if (e.target.closest('a, button, .hc-item')) return;
      openHeroBuild(hero.id);
    },
  },
    el('div', { class: 'hc-banner' },
      gameImg([images.icon_hero_card_webp, images.icon_hero_card], { alt: '', loading: 'lazy' }),
      el('div', { class: 'hc-title' },
        el('h2', { text: hero.name }),
        matches > 0 && el('span', { class: `hc-wr${winRate >= 0.51 ? ' good' : winRate < 0.47 ? ' bad' : ''}`, title: `Win rate ${windowText(HOME.window)}`, text: `${pct1(winRate)} WR` }))),
    el('div', { class: 'hc-body' },
      el('div', { class: 'hc-line', text: matches ? `Picked in ${pct1(pickRate)} of matches · ${fmtNum(matches)} games` : 'No recent match data' }),
      el('div', { class: 'hc-label', text: tb ? `Top players’ core · ${STYLE_NAMES[tb.style]}, in buy order` : 'Core items' }),
      el('div', { class: 'hc-items' }, core.length
        ? [core.slice(0, 10).map(miniItem), core.length > 10 && el('span', { class: 'hc-more', title: core.slice(10).map(i => i.name).join(', '), text: `+${core.length - 10}` })]
        : el('span', { class: 'hc-loading', text: 'Not enough match data' })),
      el('div', { class: 'hc-build', id: `hcb-${hero.id}` }, tb ? topBuildBlock(hero, tb) : buildBlock(hero.id))));
}

function topBuildBlock(hero, tb) {
  const open = e => { e.preventDefault(); goTop(hero.id); };
  return [
    el('div', { class: 'hc-label', text: 'Meta build' }),
    el('a', { class: 'hc-build-name', href: `?top=${hero.id}`, onclick: open, text: `Top Players’ ${STYLE_NAMES[tb.style]} Build` }),
    el('div', { class: 'hc-meta' },
      el('span', { class: tb.wins / tb.games >= tb.heroWinRate ? 'hc-good' : null, title: `Ascendant+ players with this playstyle won ${tb.wins} of ${tb.games} games`, text: `Won ${pct1(tb.wins / tb.games)} of ${fmtNum(tb.games)} Ascendant+ games` }),
      el('span', { text: `${fmtNum(tb.players)} players` })),
    el('div', { class: 'hc-actions' },
      el('a', { class: 'pill hc-open', href: `?top=${hero.id}`, onclick: open, text: 'Open' })),
  ];
}

function buildBlock(heroId) {
  const pick = HOME.builds.get(heroId);
  if (!pick) return el('p', { class: 'hc-loading', text: 'Finding the best current build…' });
  if (pick.error) return el('p', { class: 'hc-loading', text: 'Couldn’t load builds for this hero.' });
  if (pick.none) return el('p', { class: 'hc-loading', text: 'No community builds found.' });
  const { build, favorites } = pick;
  const id = build.hero_build_id;
  const open = e => { e.preventDefault(); go(id); };
  const proven = pick.source === 'proven';
  const rate = proven && pick.wins / pick.matches;
  return [
    el('div', { class: 'hc-label', text: proven ? 'Best-performing build' : 'Most popular build' }),
    el('a', { class: 'hc-build-name', href: `?id=${id}`, onclick: open, text: build.name || 'Untitled build', title: build.name }),
    el('div', { class: 'hc-meta' },
      el('span', { class: 'fav', title: 'Favorites' }, el('span', { class: 'fav-icon', 'aria-hidden': 'true' }), fmtNum(favorites)),
      proven && el('span', { class: rate >= pick.base ? 'hc-good' : null, title: `Players who chose this build won ${pick.wins} of ${pick.matches} games over the last ${PROVEN_DAYS} days${pick.rank === 'high' ? ' at Phantom+' : ''}; all builds for this hero averaged ${pct1(pick.base)}`,
        text: `Won ${pct1(rate)} of ${fmtNum(pick.matches)} games (${signedPct(rate - pick.base)} vs other builds)` }),
      proven && el('span', { text: `${fmtNum(pick.players)} players` }),
      el('span', { text: `Updated ${relativeDay(build.last_updated_timestamp)}` }),
      !proven && pick.total > 0 && el('span', { title: 'How many of the core items this build includes', text: `${pick.hits}/${pick.total} core items` })),
    el('div', { class: 'hc-actions' },
      el('button', { class: 'hc-id', type: 'button', title: 'Copy the build ID to search for it in the in-game build browser', onclick: e => copyBuildId(e, id) },
        el('span', { text: 'ID' }), el('b', { text: id })),
      el('a', { class: 'pill hc-open', href: `?id=${id}`, onclick: open, text: 'Open' })),
  ];
}

function updateHeroBuild(heroId) {
  const box = $(`#hcb-${heroId}`);
  if (box) box.replaceChildren(...[buildBlock(heroId)].flat());
}

/* tier list */

// Tiers combine every signal we have: real win rates and head-to-head records, real-match impact,
// simulated duels with the full meta build (gun, item and ability stats), crowd control and utility
// in each kit, how often top players pick the hero, and community balance talk. Each factor becomes
// a z-score (how far above or below the average hero), and tiers come from the weighted total.
const TIER_FACTORS = [
  { key: 'winRate', label: 'Win rate', weight: 0.32, about: 'Real win rate since the patch (Phantom+ counts more than all ranks), adjusted for small samples.' },
  { key: 'duels', label: 'Damage & items', weight: 0.16, about: 'Simulated 1v1 duels at max level with the full meta build: gun, item and ability stats.' },
  { key: 'impact', label: 'Match impact', weight: 0.12, about: 'Real kills and assists per death, hero damage and objective damage per match.' },
  { key: 'matchups', label: 'Matchups', weight: 0.10, about: 'How many enemy heroes they beat head-to-head in real matches.' },
  { key: 'cc', label: 'Crowd control', weight: 0.08, about: 'Stuns, sleeps, roots, silences, pulls and slows in their abilities, by strength and cooldown.' },
  { key: 'popularity', label: 'Top-player picks', weight: 0.08, about: 'How often Phantom+ players pick them.' },
  { key: 'community', label: 'Community', weight: 0.08, about: 'Whether this week’s balance talk on r/DeadlockTheGame calls them strong or weak.' },
  { key: 'utility', label: 'Sustain & utility', weight: 0.06, about: 'Healing, barriers, invisibility and mobility in their abilities.' },
];
const TIER_RANGES = [8, 18, 30];
const TIER_SIM = { headshot: 0.15, abilityHit: 0.75, mode: 'full', ultimates: true };
const TIERS = [
  { key: 'S+', label: 'Overpowered', min: 1.6, colors: ['#e8264d', '#e0157f'] },
  { key: 'S', label: 'Meta Defining', min: 0.8, colors: ['#f2b10a', '#ee5a12'] },
  { key: 'A', label: 'Strong Picks', min: 0, colors: ['#9b2cf0', '#6f1fd0'] },
  { key: 'B', label: 'Viable', min: -0.8, colors: ['#2f6bf5', '#1c4ad6'] },
  { key: 'C', label: 'Situational', min: -Infinity, colors: ['#4a5368', '#353b4b'] },
];

// Real matches since the patch: hero stats at all ranks and Phantom+, and head-to-head records.
const loadMatchStats = () => once('matchStats', async () => {
  const [all, high, counters] = await Promise.all([
    getJSON(`${API}/analytics/hero-stats?${await matchFilter('all')}`),
    getJSON(`${API}/analytics/hero-stats?${await matchFilter('high')}`),
    getJSON(`${API}/analytics/hero-counter-stats?${await matchFilter('all')}`).catch(() => []),
  ]);
  const byHero = rows => new Map(rows.map(r => [r.hero_id, r]));
  return { all: byHero(all), high: byHero(high), counters };
});

// Community balance talk, gathered every few hours by tools/serve.py. Missing when the page isn't
// served by it, and then the tier list leaves the factor out.
const loadCommunity = () => once('community', () => getJSON('data/community.json').catch(() => null));

const duelShare = r => (r.wins + r.draws / 2) / Math.max(1, r.wins + r.losses + r.draws);

// Every hero's Phantom+ meta build at max level fights every other hero's at close, mid and long range.
const loadDuels = () => once('duels', async () => {
  const [heroes, meta, assets] = await Promise.all([loadHeroList(), loadMeta('high'), loadAssets()]);
  state.assets ??= assets;
  const orders = await loadAbilityOrders('high', heroes);
  const souls = maxSouls(heroes[0]);
  const opts = { ...TIER_SIM, accuracy: meta.accuracy };
  const fighters = heroes
    .map(hero => ({ hero, F: buildFighter(hero, loadoutAt(metaOrder(hero.id, meta), souls), souls, orders.get(hero.id) ?? defaultAbilitySequence(hero), opts) }))
    .filter(f => f.F);
  const n = fighters.length;
  const results = fighters.map(() => ({ margin: 0, wins: 0, losses: 0, draws: 0, vs: new Map() }));
  const cap = SIM_MAX * 1.2;
  const pairs = (n * (n - 1)) / 2;
  let done = 0;
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      // Margin: how many times faster one side kills the other (log2, capped), averaged over ranges.
      let margin = 0;
      for (const range of TIER_RANGES) {
        const r = simulate(fighters[i].F, fighters[j].F, { ...opts, range });
        margin += Math.max(-2, Math.min(2, Math.log2((r.them ?? cap) / (r.you ?? cap))));
      }
      margin /= TIER_RANGES.length;
      results[i].vs.set(fighters[j].hero.id, margin);
      results[j].vs.set(fighters[i].hero.id, -margin);
      results[i].margin += margin;
      results[j].margin -= margin;
      if (margin > 0.05) { results[i].wins++; results[j].losses++; }
      else if (margin < -0.05) { results[j].wins++; results[i].losses++; }
      else { results[i].draws++; results[j].draws++; }
      done++;
    }
    HOME.tierProgress?.(done / pairs);
    await new Promise(r => setTimeout(r)); // keep the page responsive between heroes
  }
  const stats = new Map();
  fighters.forEach(({ hero, F }, i) => {
    const sample = simulate(F, { dummy: true }, { ...opts, range: 18 }, SAMPLE_SECONDS).a.bySource;
    const vs = [...results[i].vs.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => id);
    stats.set(hero.id, {
      ...results[i], score: results[i].margin / Math.max(1, n - 1),
      best: vs.slice(0, 3), worst: vs.slice(-3).reverse(),
      damage: sample.gun + sample.items + sample.abilities,
      health: fighterStats(F, 0, 18).health + F.barrier,
      simplified: F.abilities.filter(a => a.model && (!a.model.modeled || a.model.skipped)).map(a => a.ability.name),
    });
  });
  return { stats, fights: pairs * TIER_RANGES.length, souls };
});

const abilitySentences = a => (a.description?.desc ?? '')
  .replace(/<svg[\s\S]*?<\/svg>/gi, ' ').replace(/<[^>]+>/g, ' ').split(/(?<=[.!?])\s+/);

// Crowd control and utility in a hero's four abilities, weighted per second of cooldown.
function kitScores(hero) {
  let cc = 0, utility = 0, heals = 0, mobility = 0;
  for (const slot of ['signature1', 'signature2', 'signature3', 'signature4']) {
    const a = state.assets.byClass.get(hero.items?.[slot]);
    if (!a) continue;
    // Values at max level: base plus every ability upgrade (some CC, like Dynamo's slow, only comes from upgrades).
    const props = Object.fromEntries(Object.entries(a.properties ?? {}).map(([k, p]) => [k, num(p?.value)]));
    for (const up of a.upgrades ?? []) {
      for (const p of up.property_upgrades ?? []) {
        const base = props[p.name] ?? 0, bonus = num(p.bonus);
        // "+33%" on a duration means 33% longer, not 33 more seconds.
        props[p.name] = /%\s*$/.test(String(p.bonus)) && base && !/percent|pct/i.test(p.name) ? base * (1 + bonus / 100) : base + bonus;
      }
    }
    const keys = Object.keys(props).filter(k => props[k] || /^Has/.test(k));
    const has = re => keys.some(k => re.test(k));
    const val = re => keys.filter(k => re.test(k)).reduce((m, k) => Math.max(m, Math.abs(props[k])), 0);
    const share = x => (x > 1 ? x / 100 : x);
    const says = re => abilitySentences(a).some(s => re.test(s) && /enem|target|hero|character/i.test(s));
    // Ultimates usually land once a fight, so long cooldowns are capped rather than counted in full.
    const cooldown = Math.min(60, Math.max(4, val(/^AbilityCooldown$/) || 20));

    // Hard CC (stuns, sleeps, roots, silences, disarms, pulls, lifts) counts double a full slow.
    let hard = val(/^(Stun|Sleep|Immobilize|Silence|Disarm|Tether|Pull|Root|Freeze|Hex|\w*KnockUp)\w*Duration$/i);
    if (!hard && (has(/^(LiftHeight|PullDistance|VacuumRadius|EnemyDragSpeed|HasDisarm)$/i)
      || says(/\b(stun|sleep|immobiliz|silenc|disarm|pull|lift|root|tether|grab|trap|knock|into the air|airborne)/i))) {
      hard = Math.min(3, val(/^(AbilityDuration|AbilityChannelTime)$/) || 1);
    }
    const slow = Math.min(1, share(val(/^(SlowPercent|EnemySlowPct|MoveSlowPercent|ChannelSlowPercent|MaxSlowPercent|MaxSlow|AuraSlowAmount|SlowPercentPerStack|FadingSlowPercent|HeavyMeleeSlowPercent)$/i)))
      * Math.min(6, val(/^(SlowDuration|EnemySlowDuration|MaxSlowTime|HeavyMeleeSlowDuration)$/i) || 2);
    const fireSlow = Math.min(1, share(val(/^(FireRateSlow|MaxFireRateSlowPercent)$/i))) * Math.min(6, val(/^FireRateSlowDuration$/i) || 2);
    cc += (2 * Math.min(4, hard) + slow + fireSlow / 2) / cooldown;

    const kinds = [
      has(/heal/i) && !has(/^HealAmp\w*Penalty/i) || says(/\bheal/i),
      has(/barrier/i),
      has(/invis|stealth/i),
      has(/^(Dash|Teleport|Grapple|Fly|Flight)|^(BonusMoveSpeed|MoveSpeedBonus|MovementSpeedBonus|BonusSprintSpeed|SprintSpeedBonus|BonusMoveSpeedPercent|MoveSpeedBonusPct)$/i),
    ];
    utility += (10 * kinds.filter(Boolean).length) / cooldown;
    // For the counter page: abilities that really heal ("Heal", not "Health"), ones that put the hero
    // in the air (a full point), and dashes or short hops (half a point).
    const healKey = k => /Heal(?!th)|Life[Ss]teal|LifeDrain|HealthSteal|HealthRegen/.test(k) && !/Penalty|Reduction|^HealAmp|Disable|Radius|Interval|Duration|NonHero|Turret/.test(k);
    const selfSays = re => abilitySentences(a).some(s => re.test(s));
    heals += keys.some(healKey) || selfSays(/\b(swaps?|steals?|drains?)\b[^.]*\bhealth\b/i) ? 1 : 0;
    mobility += has(/^(MaxFlyHeight|FlyingItemCastRange|FlightControlEnabled|UpBoostSpeed|JumpVelocity|JumpSpeed)$/) || selfSays(/\b(take\s+flight|and\s+fly\b|glide|to\s+float)/i) ? 1
      : has(/^(DashSpeed|ChargeSpeedMax|AirSpeedMax|JumpForce|TeleportCompletedTime|\w*JumpVelocity\w*)$/) ? 0.5 : 0;
  }
  return { cc, utility, heals, mobility };
}

// z-scores (how many standard deviations from the average hero), capped so one outlier can't dominate.
// `center` replaces the average when a factor has a natural neutral point.
function zScores(raw, center = null) {
  const xs = [...raw.values()];
  if (xs.length < 3) return new Map();
  const mean = center ?? xs.reduce((s, x) => s + x, 0) / xs.length;
  const sd = Math.sqrt(xs.reduce((s, x) => s + (x - mean) ** 2, 0) / xs.length) || 1;
  return new Map([...raw].map(([id, x]) => [id, Math.max(-2.5, Math.min(2.5, (x - mean) / sd))]));
}

const shrunkRate = (wins, matches, k) => (wins + k / 2) / (matches + k);

// The tier list for a rank ('all' or 'high'). With the local match sample it comes from the strength
// model; without it (page not served by tools/serve.py), from a weighted blend of the same factors.
const loadTiers = (rank = 'all') => once(`tiers:${rank}`, async () => {
  const [heroes, duels, match, community, bans, model] = await Promise.all([
    loadHeroList(), loadDuels(), loadMatchStats(), loadCommunity(), loadBans(),
    fitHeroModel(rank, n => HOME.modelProgress?.(n)).catch(err => { console.warn('Hero model failed', err); return null; }),
  ]);
  const ids = heroes.map(h => h.id).filter(id => duels.stats.has(id) || match.all.has(id));
  const raw = Object.fromEntries(TIER_FACTORS.map(f => [f.key, new Map()]));
  const info = new Map(ids.map(id => [id, {}]));
  const pickRows = rank === 'high' ? match.high : match.all;
  const pickTotal = [...pickRows.values()].reduce((s, r) => s + r.matches, 0);

  for (const id of ids) {
    const all = match.all.get(id), high = match.high.get(id), d = duels.stats.get(id), i = info.get(id);
    if (all?.matches) {
      i.wrAll = all.wins / all.matches;
      i.wrHigh = high?.matches ? high.wins / high.matches : null;
      const shrunk = shrunkRate(all.wins, all.matches, 300);
      raw.winRate.set(id, high?.matches ? 0.6 * shrunkRate(high.wins, high.matches, 300) + 0.4 * shrunk : shrunk);
      i.kda = (all.total_kills + all.total_assists) / Math.max(1, all.total_deaths);
      i.damage = all.total_player_damage / all.matches;
      i.objective = all.total_boss_damage / all.matches;
    }
    const picks = pickRows.get(id);
    if (picks?.matches && pickTotal) {
      i.pickRate = (12 * picks.matches) / pickTotal;
      raw.popularity.set(id, i.pickRate);
    }
    if (bans.has(id)) i.banShare = bans.get(id);
    if (d) raw.duels.set(id, d.score);
    const hero = heroes.find(h => h.id === id);
    const kit = kitScores(hero);
    raw.cc.set(id, kit.cc);
    raw.utility.set(id, kit.utility);
  }

  // Match impact: the average of how a hero ranks on KDA, hero damage and objective damage.
  const sub = ['kda', 'damage', 'objective'].map(k => zScores(new Map(ids.filter(id => info.get(id)[k] != null).map(id => [id, info.get(id)[k]]))));
  for (const id of ids) if (info.get(id).kda != null) raw.impact.set(id, sub.reduce((s, z) => s + (z.get(id) ?? 0), 0) / sub.length);

  // Matchups: enemies a hero beats head-to-head (with enough games to tell).
  for (const id of ids) {
    const rows = match.counters.filter(r => r.hero_id === id && r.enemy_hero_id !== id && r.matches_played >= 40);
    if (rows.length < 5) continue;
    const won = rows.filter(r => shrunkRate(r.wins, r.matches_played, 40) > 0.5).length;
    Object.assign(info.get(id), { matchupsWon: won, matchupsTotal: rows.length });
    raw.matchups.set(id, won / rows.length);
  }

  // Community: more "strong" than "weak" calls pushes a hero up; a handful of calls barely moves them.
  if (community?.heroes) {
    for (const id of ids) {
      const t = community.heroes[id] ?? { mentions: 0, strong: 0, weak: 0 };
      info.get(id).community = t;
      raw.community.set(id, (t.strong - t.weak) / (t.strong + t.weak + 4));
    }
  }

  // A hero nobody calls strong or weak is neutral, not below the (hype-skewed) average.
  const z = Object.fromEntries(TIER_FACTORS.map(f => [f.key, zScores(raw[f.key], f.key === 'community' ? 0 : null)]));
  z.bans = zScores(new Map(ids.filter(id => info.get(id).banShare != null).map(id => [id, info.get(id).banShare])));

  if (model) {
    const combined = combineWithFactors(model, z, ids);
    // Placed the same way from the games before the latest patch, to show tier moves since.
    const earlier = model.before ? combineWithFactors(model.before, z, ids) : null;
    const tierIndex = t => TIERS.indexOf(t);
    const stats = new Map();
    for (const id of ids) {
      const c = combined.heroes.get(id);
